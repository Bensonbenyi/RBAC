upstream rbac_backend { server rbac:8080; keepalive 16; }
upstream course_backend { server course:8080; keepalive 16; }
server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 1m;
 proxy_http_version 1.1;
 proxy_set_header Connection "";
 location = / { return 302 /platform/; }
 location = /api-docs { return 302 /api-docs/; }
 location /api-docs/ { try_files $uri $uri/ =404; add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always; }
 location /coverage/ { try_files $uri $uri/ =404; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-hashes' 'sha256-G/iMsAC9lxfd0xvqi4sO/+iakNhc8n7RdfgtGPpCyBI=' 'sha256-B85a281WJt4NQM6/Nspdip9X5Y/pCC+fMLFph5s4U5w=' 'sha256-Bjq+fr8lydh2OUNF5bkRg3ezXUESUPAcdyKxoLf/lIM=' 'sha256-rjPKzQ4oYHpb9O4CVVZ/Ou48aaWYcFH6lEMcRJY1xjQ='; frame-ancestors 'none'; base-uri 'self'" always; }
 location /platform/ { try_files $uri $uri/ /platform/index.html; }
 location /course/ { try_files $uri $uri/ /course/index.html; }
 location /auth/ { proxy_pass http://rbac_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /identity/ { proxy_pass http://rbac_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /api/ { proxy_pass http://rbac_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /course-api/ { proxy_pass http://course_backend/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location = /health { access_log off; return 200 'ok'; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
}
