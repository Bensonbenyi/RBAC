server {
 listen 80;
 server_tokens off;
 client_max_body_size 1m;
 location = / { return 302 /platform/; }
 location /platform/ { try_files $uri $uri/ /platform/index.html; }
 location /course/ { try_files $uri $uri/ /course/index.html; }
 location /auth/ { proxy_pass http://rbac:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /identity/ { proxy_pass http://rbac:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /api/ { proxy_pass http://rbac:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /course-api/ { proxy_pass http://course:8080/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location = /health { access_log off; return 200 'ok'; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
}
