spring:
  application:
    name: rbac
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rbac?serverTimezone=Asia/Shanghai}
    username: ${DB_USER:rbac}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  backend-strategy: ${BACKEND_STRATEGY:structured}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:file:.runtime/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:.runtime/public.pem}
    issuer: rbac
    lifetime: 30m
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
logging:
  level:
    cn.edu.xmu.rbac: DEBUG
