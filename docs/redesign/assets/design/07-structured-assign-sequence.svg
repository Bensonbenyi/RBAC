<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38" font-size="26" text-anchor="middle" font-weight="600">结构化时序图  分配用户角色</text><text x="600.0" y="72" font-size="16" text-anchor="middle" font-weight="400">前提：Session 已认证、请求格式校验通过；Service 公共方法开启事务</text><rect x="55" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="180" y="139" font-size="17" text-anchor="middle" font-weight="400">api</text><text x="180" y="164" font-size="17" text-anchor="middle" font-weight="400">UserRoleController</text><path d="M 180,180 L 180,1490" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="335" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="460" y="139" font-size="17" text-anchor="middle" font-weight="400">service</text><text x="460" y="164" font-size="17" text-anchor="middle" font-weight="400">StructuredUserRoleService</text><path d="M 460,180 L 460,1490" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="615" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="740" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="740" y="164" font-size="17" text-anchor="middle" font-weight="400">AssignmentReader</text><path d="M 740,180 L 740,1490" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="895" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1020" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1020" y="164" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 1020,180 L 1020,1490" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 180,230 L 275,230 L 275,265 L 180,265" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="285" y="233" width="339.46" height="23" fill="white"/><text x="290" y="250" font-size="17" text-anchor="start" font-weight="400">1. CloneFactory.copy(command, dto)</text><path d="M 180,340 L 460,340" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="455" y="340" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="145.425" y="310" width="349.15" height="23" fill="white"/><text x="320.0" y="327" font-size="17" text-anchor="middle" font-weight="400">2. assign(actorId, userId, command)</text><path d="M 460,420 L 740,420" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="420" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="338.21500000000003" y="390" width="523.5699999999999" height="23" fill="white"/><text x="600.0" y="407" font-size="17" text-anchor="middle" font-weight="400">3. hasPermission(actorId, &quot;rbac&quot;, &quot;user.role.assign&quot;)</text><path d="M 740,480 L 460,480" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="546.55" y="450" width="106.89999999999999" height="23" fill="white"/><text x="600.0" y="467" font-size="17" text-anchor="middle" font-weight="400">4. allowed</text><rect x="35" y="520" width="1130" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="544" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="544" font-size="17" text-anchor="start" font-weight="400">[没有分配权限]</text><path d="M 460,590 L 180,590" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="179.34" y="560" width="281.32" height="23" fill="white"/><text x="320.0" y="577" font-size="17" text-anchor="middle" font-weight="400">5. ForbiddenException -&gt; 403</text><path d="M 460,690 L 1020,690" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="690" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="552.08" y="660" width="375.84" height="23" fill="white"/><text x="740.0" y="677" font-size="17" text-anchor="middle" font-weight="400">6. findById(actorId)；findById(userId)</text><path d="M 1020,750 L 460,750" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="639.29" y="720" width="201.42" height="23" fill="white"/><text x="740.0" y="737" font-size="17" text-anchor="middle" font-weight="400">7. actor、targetUser</text><path d="M 460,820 L 740,820" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="820" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="502.945" y="790" width="194.10999999999999" height="23" fill="white"/><text x="600.0" y="807" font-size="17" text-anchor="middle" font-weight="400">8. findRole(roleId)</text><path d="M 740,880 L 460,880" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="561.085" y="850" width="77.83" height="23" fill="white"/><text x="600.0" y="867" font-size="17" text-anchor="middle" font-weight="400">9. role</text><path d="M 460,945 L 555,945 L 555,980 L 460,980" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="565" y="948" width="337.76" height="23" fill="white"/><text x="570" y="965" font-size="17" text-anchor="start" font-weight="400">10. 检查存在、同一非空部门、角色未重复</text><rect x="35" y="1030" width="1130" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="1054" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="1054" font-size="17" text-anchor="start" font-weight="400">[校验失败]</text><path d="M 460,1100 L 180,1100" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="188.945" y="1070" width="262.11" height="23" fill="white"/><text x="320.0" y="1087" font-size="17" text-anchor="middle" font-weight="400">11. 404 / 403 / 409；不写入</text><path d="M 460,1210 L 1020,1210" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="1210" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="604.185" y="1180" width="271.63" height="23" fill="white"/><text x="740.0" y="1197" font-size="17" text-anchor="middle" font-weight="400">12. addRole(userId, roleId)</text><path d="M 1020,1270 L 460,1270" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="681.62" y="1240" width="116.75999999999999" height="23" fill="white"/><text x="740.0" y="1257" font-size="17" text-anchor="middle" font-weight="400">13. 写入完成</text><path d="M 460,1390 L 180,1390" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="219.12" y="1360" width="201.76" height="23" fill="white"/><text x="320.0" y="1377" font-size="17" text-anchor="middle" font-weight="400">14. 事务提交后返回成功</text><rect x="55" y="1515" width="1090" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="70" y="1542" font-size="17" text-anchor="start" font-weight="400">同部门是分配约束；是否能执行分配仍由角色中的 user.role.assign 权限决定。</text><text x="70" y="1567" font-size="17" text-anchor="start" font-weight="400">SQL 或提交异常导致事务回滚并返回错误；适配器只执行读写，规则留在 Service。</text></svg>