<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1500" viewBox="0 0 1760 1500"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="880.0" y="38" font-size="26" text-anchor="middle" font-weight="600">共享登录时序图</text><text x="880.0" y="72" font-size="16" text-anchor="middle" font-weight="400">service 为配置选中的 StructuredAuthService 或 DddAuthService；password 内容为手机号</text><rect x="55" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="180" y="139" font-size="17" text-anchor="middle" font-weight="400">客户端</text><path d="M 180,180 L 180,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="335" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="460" y="139" font-size="17" text-anchor="middle" font-weight="400">api</text><text x="460" y="164" font-size="17" text-anchor="middle" font-weight="400">AuthController</text><path d="M 460,180 L 460,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="615" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="740" y="139" font-size="17" text-anchor="middle" font-weight="400">service</text><text x="740" y="164" font-size="17" text-anchor="middle" font-weight="400">AuthUseCase 实现</text><path d="M 740,180 L 740,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="895" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1020" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1020" y="164" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 1020,180 L 1020,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="1175" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1300" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1300" y="164" font-size="17" text-anchor="middle" font-weight="400">RbacReader</text><path d="M 1300,180 L 1300,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="1455" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1580" y="139" font-size="17" text-anchor="middle" font-weight="400">security</text><text x="1580" y="164" font-size="17" text-anchor="middle" font-weight="400">HttpSession</text><path d="M 1580,180 L 1580,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 180,240 L 460,240" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="455" y="240" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="222.945" y="210" width="194.10999999999999" height="23" fill="white"/><text x="320.0" y="227" font-size="17" text-anchor="middle" font-weight="400">1. POST /auth/login</text><path d="M 460,300 L 555,300 L 555,335 L 460,335" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="565" y="303" width="414.59999999999997" height="23" fill="white"/><text x="570" y="320" font-size="17" text-anchor="start" font-weight="400">2. @Valid；CloneFactory.copy(command, dto)</text><path d="M 460,410 L 740,410" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="410" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="512.635" y="380" width="174.73" height="23" fill="white"/><text x="600.0" y="397" font-size="17" text-anchor="middle" font-weight="400">3. login(command)</text><path d="M 740,490 L 1020,490" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="490" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="744.185" y="460" width="271.63" height="23" fill="white"/><text x="880.0" y="477" font-size="17" text-anchor="middle" font-weight="400">4. findByUsername(username)</text><path d="M 1020,550 L 740,550" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="809.465" y="520" width="141.07" height="23" fill="white"/><text x="880.0" y="537" font-size="17" text-anchor="middle" font-weight="400">5. 用户读取结果</text><rect x="35" y="590" width="1690" height="110" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="614" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="614" font-size="17" text-anchor="start" font-weight="400">[用户不存在或手机号不匹配]</text><path d="M 740,665 L 460,665" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="501.58500000000004" y="635" width="196.82999999999998" height="23" fill="white"/><text x="600.0" y="652" font-size="17" text-anchor="middle" font-weight="400">6. 认证失败；映射 401</text><path d="M 740,770 L 1300,770" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1295" y="770" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="801.82" y="740" width="436.35999999999996" height="23" fill="white"/><text x="1020.0" y="757" font-size="17" text-anchor="middle" font-weight="400">7. hasPermission(userId, systemKey, &quot;login&quot;)</text><path d="M 1300,830 L 740,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="966.55" y="800" width="106.89999999999999" height="23" fill="white"/><text x="1020.0" y="817" font-size="17" text-anchor="middle" font-weight="400">8. allowed</text><rect x="35" y="870" width="1690" height="110" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="894" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="894" font-size="17" text-anchor="start" font-weight="400">[allowed = false]</text><path d="M 740,945 L 460,945" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="501.58500000000004" y="915" width="196.82999999999998" height="23" fill="white"/><text x="600.0" y="932" font-size="17" text-anchor="middle" font-weight="400">9. 禁止登录；映射 403</text><path d="M 740,1050 L 460,1050" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="430.27" y="1020" width="339.46" height="23" fill="white"/><text x="600.0" y="1037" font-size="17" text-anchor="middle" font-weight="400">10. LoginResult(userId, systemKey)</text><path d="M 460,1120 L 1580,1120" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1575" y="1120" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="813.8050000000001" y="1090" width="412.39" height="23" fill="white"/><text x="1020.0" y="1107" font-size="17" text-anchor="middle" font-weight="400">11. 更换 Session ID，保存 userId、systemKey</text><path d="M 460,1185 L 555,1185 L 555,1220 L 460,1220" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="565" y="1188" width="329.77" height="23" fill="white"/><text x="570" y="1205" font-size="17" text-anchor="start" font-weight="400">12. CloneFactory.copy(vo, result)</text><path d="M 460,1300 L 180,1300" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="175.685" y="1270" width="288.63" height="23" fill="white"/><text x="320.0" y="1287" font-size="17" text-anchor="middle" font-weight="400">13. 200 + LoginVO；Set-Cookie</text><rect x="55" y="1395" width="1650" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="70" y="1422" font-size="17" text-anchor="start" font-weight="400">凭据匹配：结构化版在 Service 校验；DDD 版调用 User 的匹配行为。身份成功后仍须查 RBAC。</text><text x="70" y="1447" font-size="17" text-anchor="start" font-weight="400">Session 不保存权限快照；后续敏感操作重新查权限。参数错误返回 400，不进入 Service。</text></svg>