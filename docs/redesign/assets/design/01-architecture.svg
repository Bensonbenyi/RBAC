<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750.0" y="38" font-size="26" text-anchor="middle" font-weight="600">双实现分层架构  包依赖图</text><text x="750.0" y="72" font-size="16" text-anchor="middle" font-weight="400">共享 API / Service Port / Infrastructure；配置仅装配一套 Service</text><rect x="50" y="130" width="400" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="50" y="112" width="180" height="18" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="250.0" y="162" font-size="21" text-anchor="middle" font-weight="600">api</text><text x="250.0" y="195" font-size="17" text-anchor="middle" font-weight="400">auth / user / role / permission</text><text x="250.0" y="221" font-size="17" text-anchor="middle" font-weight="400">department / system</text><text x="250.0" y="247" font-size="17" text-anchor="middle" font-weight="400">Controller  DTO  VO  @Valid</text><rect x="920" y="130" width="530" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="920" y="112" width="180" height="18" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1185.0" y="162" font-size="21" text-anchor="middle" font-weight="600">service.port</text><text x="1185.0" y="195" font-size="17" text-anchor="middle" font-weight="400">用例接口：AuthUseCase / UserRoleUseCase …</text><text x="1185.0" y="221" font-size="17" text-anchor="middle" font-weight="400">输入输出：Command / Result</text><text x="1185.0" y="247" font-size="17" text-anchor="middle" font-weight="400">持久化端口：UserStore / RoleReader / RbacReader</text><rect x="50" y="430" width="400" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="50" y="412" width="180" height="18" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="250.0" y="462" font-size="21" text-anchor="middle" font-weight="600">service.structured</text><text x="250.0" y="495" font-size="17" text-anchor="middle" font-weight="400">事务脚本  顺序校验  Repository 编排</text><text x="250.0" y="521" font-size="17" text-anchor="middle" font-weight="400">StructuredAuthService</text><text x="250.0" y="547" font-size="17" text-anchor="middle" font-weight="400">StructuredUserRoleService …</text><rect x="920" y="430" width="530" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="920" y="412" width="180" height="18" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1185.0" y="462" font-size="21" text-anchor="middle" font-weight="600">service.ddd</text><text x="1185.0" y="495" font-size="17" text-anchor="middle" font-weight="400">application：用例编排与事务</text><text x="1185.0" y="521" font-size="17" text-anchor="middle" font-weight="400">domain：User / Role 聚合、分配规则</text><text x="1185.0" y="547" font-size="17" text-anchor="middle" font-weight="400">DddAuthService / DddUserRoleService …</text><rect x="485" y="755" width="530" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="485" y="737" width="180" height="18" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="750.0" y="787" font-size="21" text-anchor="middle" font-weight="600">infrastructure</text><text x="750.0" y="820" font-size="17" text-anchor="middle" font-weight="400">persistence：端口适配 / JPA Entity / Repository</text><text x="750.0" y="846" font-size="17" text-anchor="middle" font-weight="400">security：Session / Cookie / 当前身份适配</text><text x="750.0" y="872" font-size="17" text-anchor="middle" font-weight="400">logging：SLF4J + Logback</text><path d="M 455,220 L 915,220" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="685" y="200" font-size="17" text-anchor="middle" font-weight="400">依赖用例接口</text><path d="M 455,475 L 649.0,475.0 Q 665,475 665.0,459.0 L 665.0,286.0 Q 665,270 681.0,270.0 L 915,270" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="685" y="455" font-size="16" text-anchor="middle" font-weight="400">依赖契约与持久化端口</text><path d="M 1185,425 L 1185,320" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="1300" y="380" font-size="16" text-anchor="middle" font-weight="400">依赖契约</text><path d="M 1020,850 L 1464.0,850.0 Q 1480,850 1480.0,834.0 L 1480.0,356.0 Q 1480,340 1464.0,340.0 L 1386.0,340.0 Q 1370,340 1370.0,333.3333333333333 L 1370,320" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="1260" y="830" font-size="16" text-anchor="middle" font-weight="400">实现持久化端口（包依赖）</text><rect x="50" y="755" width="400" height="99" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="65" y="782" font-size="17" text-anchor="start" font-weight="400">配置：app.backend-strategy</text><text x="65" y="807" font-size="17" text-anchor="start" font-weight="400">structured 或 ddd</text><text x="65" y="832" font-size="17" text-anchor="start" font-weight="400">启动时只注册对应实现 Bean</text><rect x="1050" y="900" width="400" height="99" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1065" y="927" font-size="17" text-anchor="start" font-weight="400">两套实现使用同一数据库、同一 API</text><text x="1065" y="952" font-size="17" text-anchor="start" font-weight="400">CloneFactory 用于边界对象拷贝</text><text x="1065" y="977" font-size="17" text-anchor="start" font-weight="400">各可执行层通过 Logback 记日志</text><rect x="50" y="985" width="965" height="99" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="65" y="1012" font-size="17" text-anchor="start" font-weight="400">虚线开箭头：源码依赖，箭头指向被依赖包；图中位置不表示调用顺序。</text><text x="65" y="1037" font-size="17" text-anchor="start" font-weight="400">Service 通过 service.port 内的持久化接口调用 Infrastructure 适配器。</text><text x="65" y="1062" font-size="17" text-anchor="start" font-weight="400">运行调用路径：Controller -&gt; 用例接口 -&gt; 被选中的 Service -&gt; 持久化端口 -&gt; JPA 适配器。</text></svg>