<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1390" viewBox="0 0 1480 1390"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="740.0" y="38" font-size="26" text-anchor="middle" font-weight="600">共享操作鉴权时序图</text><text x="740.0" y="72" font-size="16" text-anchor="middle" font-weight="400">示例：删除本部门用户；两套实现使用同一 RBAC 授权来源</text><rect x="55" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="180" y="139" font-size="17" text-anchor="middle" font-weight="400">客户端</text><path d="M 180,180 L 180,1260" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="335" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="460" y="139" font-size="17" text-anchor="middle" font-weight="400">api</text><text x="460" y="164" font-size="17" text-anchor="middle" font-weight="400">Controller / 安全入口</text><path d="M 460,180 L 460,1260" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="615" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="740" y="139" font-size="17" text-anchor="middle" font-weight="400">service</text><text x="740" y="164" font-size="17" text-anchor="middle" font-weight="400">被选中的用例服务</text><path d="M 740,180 L 740,1260" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="895" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1020" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1020" y="164" font-size="17" text-anchor="middle" font-weight="400">RbacReader</text><path d="M 1020,180 L 1020,1260" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="1175" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1300" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1300" y="164" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 1300,180 L 1300,1260" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 180,230 L 460,230" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="455" y="230" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="48.525000000000034" y="200" width="542.9499999999999" height="23" fill="white"/><text x="320.0" y="217" font-size="17" text-anchor="middle" font-weight="400">1. DELETE /users/{userId} + Session Cookie + CSRF Token</text><path d="M 460,290 L 555,290 L 555,325 L 460,325" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="565" y="293" width="395.56" height="23" fill="white"/><text x="570" y="310" font-size="17" text-anchor="start" font-weight="400">2. 验证 Session、请求与 CSRF；读取 actorId</text><rect x="35" y="380" width="1410" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="404" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="404" font-size="17" text-anchor="start" font-weight="400">[Session 无效或 CSRF 校验失败]</text><path d="M 460,450 L 180,450" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="256.86" y="420" width="126.28" height="23" fill="white"/><text x="320.0" y="437" font-size="17" text-anchor="middle" font-weight="400">3. 401 / 403</text><path d="M 460,560 L 740,560" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="560" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="449.65" y="530" width="300.7" height="23" fill="white"/><text x="600.0" y="547" font-size="17" text-anchor="middle" font-weight="400">4. deleteUser(actorId, userId)</text><path d="M 740,640 L 1020,640" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="640" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="642.44" y="610" width="475.12" height="23" fill="white"/><text x="880.0" y="627" font-size="17" text-anchor="middle" font-weight="400">5. hasPermission(actorId, &quot;rbac&quot;, &quot;user.delete&quot;)</text><path d="M 1020,700 L 740,700" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="826.55" y="670" width="106.89999999999999" height="23" fill="white"/><text x="880.0" y="687" font-size="17" text-anchor="middle" font-weight="400">6. allowed</text><path d="M 740,770 L 1300,770" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1295" y="770" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="898.465" y="740" width="243.07" height="23" fill="white"/><text x="1020.0" y="757" font-size="17" text-anchor="middle" font-weight="400">7. 读取操作者与目标用户部门</text><rect x="35" y="820" width="1410" height="110" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="844" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="844" font-size="17" text-anchor="start" font-weight="400">[没有操作权限或超出部门范围]</text><path d="M 740,900 L 460,900" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="459.34000000000003" y="870" width="281.32" height="23" fill="white"/><text x="600.0" y="887" font-size="17" text-anchor="middle" font-weight="400">8. ForbiddenException -&gt; 403</text><path d="M 740,1020 L 1300,1020" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1295" y="1020" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="814.91" y="990" width="410.18" height="23" fill="white"/><text x="1020.0" y="1007" font-size="17" text-anchor="middle" font-weight="400">9. 同一事务：删除 user_role，再删除 app_user</text><path d="M 1300,1080 L 740,1080" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="978.62" y="1050" width="82.75999999999999" height="23" fill="white"/><text x="1020.0" y="1067" font-size="17" text-anchor="middle" font-weight="400">10. 完成</text><path d="M 740,1150 L 460,1150" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="516.12" y="1120" width="167.76" height="23" fill="white"/><text x="600.0" y="1137" font-size="17" text-anchor="middle" font-weight="400">11. 事务提交后成功</text><path d="M 460,1220 L 180,1220" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="281.085" y="1190" width="77.83" height="23" fill="white"/><text x="320.0" y="1207" font-size="17" text-anchor="middle" font-weight="400">12. 204</text><rect x="55" y="1285" width="1370" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="70" y="1312" font-size="17" text-anchor="start" font-weight="400">RBAC 查询只经过 user_role、role_permission、permission；查询目标系统与权限编码。</text><text x="70" y="1337" font-size="17" text-anchor="start" font-weight="400">本图省略 404 与数据库失败展开；分别返回未找到或回滚错误，不返回成功。</text></svg>