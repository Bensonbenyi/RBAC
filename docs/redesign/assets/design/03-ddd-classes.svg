<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1190" viewBox="0 0 1630 1190"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="815.0" y="38" font-size="26" text-anchor="middle" font-weight="600">DDD 设计  用户角色分配类图</text><text x="815.0" y="72" font-size="16" text-anchor="middle" font-weight="400">用户聚合维护角色 ID 集合；应用服务编排，领域对象执行规则</text><rect x="40" y="130" width="440" height="145" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="260.0" y="153" font-size="16" text-anchor="middle" font-weight="400">«interface»</text><text x="260.0" y="179" font-size="19" text-anchor="middle" font-weight="600">UserRoleUseCase</text><path d="M 40,196 L 480,196" fill="none" stroke="black" stroke-width="1.4"/><text x="52" y="224" font-size="16" text-anchor="start" font-weight="400">+ assign(actorId, userId, command)</text><rect x="40" y="450" width="440" height="160" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="260.0" y="481" font-size="19" text-anchor="middle" font-weight="600">DddUserRoleService</text><path d="M 40,498 L 480,498" fill="none" stroke="black" stroke-width="1.4"/><text x="52" y="526" font-size="16" text-anchor="start" font-weight="400">+ assign(actorId, userId, command)</text><rect x="1140" y="130" width="440" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1360.0" y="161" font-size="19" text-anchor="middle" font-weight="600">User «聚合根»</text><path d="M 1140,178 L 1580,178" fill="none" stroke="black" stroke-width="1.4"/><text x="1152" y="206" font-size="16" text-anchor="start" font-weight="400">+ assignRole(roleId)</text><text x="1152" y="233" font-size="16" text-anchor="start" font-weight="400">+ hasRole(roleId)</text><text x="1152" y="260" font-size="16" text-anchor="start" font-weight="400">+ departmentId()</text><rect x="1140" y="450" width="440" height="160" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1360.0" y="481" font-size="19" text-anchor="middle" font-weight="600">RoleAssignmentRule</text><path d="M 1140,498 L 1580,498" fill="none" stroke="black" stroke-width="1.4"/><text x="1152" y="526" font-size="16" text-anchor="start" font-weight="400">+ requireSameDepartment(actor, user, role)</text><rect x="40" y="835" width="440" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="260.0" y="858" font-size="16" text-anchor="middle" font-weight="400">«interface»</text><text x="260.0" y="884" font-size="19" text-anchor="middle" font-weight="600">UserStore</text><path d="M 40,901 L 480,901" fill="none" stroke="black" stroke-width="1.4"/><text x="52" y="929" font-size="16" text-anchor="start" font-weight="400">+ findById(userId)</text><text x="52" y="956" font-size="16" text-anchor="start" font-weight="400">+ save(snapshot)</text><rect x="610" y="835" width="440" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="830.0" y="858" font-size="16" text-anchor="middle" font-weight="400">«interface»</text><text x="830.0" y="884" font-size="19" text-anchor="middle" font-weight="600">AssignmentReader</text><path d="M 610,901 L 1050,901" fill="none" stroke="black" stroke-width="1.4"/><text x="622" y="929" font-size="16" text-anchor="start" font-weight="400">+ hasPermission(userId, system, code)</text><text x="622" y="956" font-size="16" text-anchor="start" font-weight="400">+ findRole(roleId)</text><rect x="1140" y="835" width="440" height="185" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1360.0" y="866" font-size="19" text-anchor="middle" font-weight="600">JpaUserStore</text><path d="M 1140,883 L 1580,883" fill="none" stroke="black" stroke-width="1.4"/><text x="1152" y="911" font-size="16" text-anchor="start" font-weight="400">+ findById(userId)</text><text x="1152" y="938" font-size="16" text-anchor="start" font-weight="400">+ save(snapshot)</text><path d="M 260,445 L 260,280" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#triangle)"/><path d="M 485,490 L 779.0,490.0 Q 795,490 795.0,474.0 L 795.0,246.0 Q 795,230 811.0,230.0 L 1135,230" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 485,565 L 1135,565" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 260,615 L 260,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 485,590 L 685.7560293923626,692.7123871309763 Q 700,700 716.0,700.0 L 814.0,700.0 Q 830,700 830.0,716.0 L 830,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 1360,1025 L 1360.0,1055.0 Q 1360,1070 1344.0,1070.0 L 276.0,1070.0 Q 260,1070 260.0,1055.0 L 260,1025" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#triangle)"/><rect x="560" y="115" width="500" height="124" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="575" y="142" font-size="17" text-anchor="start" font-weight="400">User 聚合：用户资料 + 已分配角色 ID</text><text x="575" y="167" font-size="17" text-anchor="start" font-weight="400">Role 聚合：角色资料 + 权限 ID</text><text x="575" y="192" font-size="17" text-anchor="start" font-weight="400">跨聚合只引用 ID；领域不依赖 JPA 或端口</text><text x="575" y="217" font-size="17" text-anchor="start" font-weight="400">共享 UserStore 传递快照，应用层重建聚合</text><text x="815" y="1137" font-size="18" text-anchor="middle" font-weight="400">应用服务把 User 转为共享快照后保存；适配器同步 user_role，不依赖 DDD 聚合类型。</text></svg>