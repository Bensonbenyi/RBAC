<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1930" viewBox="0 0 1760 1930"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="880.0" y="38" font-size="26" text-anchor="middle" font-weight="600">DDD 时序图  分配用户角色</text><text x="880.0" y="72" font-size="16" text-anchor="middle" font-weight="400">前提与结构化版相同；应用服务负责事务，聚合与领域规则负责业务约束</text><rect x="55" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="180" y="139" font-size="17" text-anchor="middle" font-weight="400">api</text><text x="180" y="164" font-size="17" text-anchor="middle" font-weight="400">UserRoleController</text><path d="M 180,180 L 180,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="335" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="460" y="139" font-size="17" text-anchor="middle" font-weight="400">application</text><text x="460" y="164" font-size="17" text-anchor="middle" font-weight="400">DddUserRoleService</text><path d="M 460,180 L 460,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="615" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="740" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="740" y="164" font-size="17" text-anchor="middle" font-weight="400">AssignmentReader</text><path d="M 740,180 L 740,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="895" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1020" y="139" font-size="17" text-anchor="middle" font-weight="400">infra</text><text x="1020" y="164" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 1020,180 L 1020,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="1175" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1300" y="139" font-size="17" text-anchor="middle" font-weight="400">domain</text><text x="1300" y="164" font-size="17" text-anchor="middle" font-weight="400">User</text><path d="M 1300,180 L 1300,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="1455" y="110" width="250" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1580" y="139" font-size="17" text-anchor="middle" font-weight="400">domain</text><text x="1580" y="164" font-size="17" text-anchor="middle" font-weight="400">RoleAssignmentRule</text><path d="M 1580,180 L 1580,1800" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 180,230 L 275,230 L 275,265 L 180,265" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="285" y="233" width="339.46" height="23" fill="white"/><text x="290" y="250" font-size="17" text-anchor="start" font-weight="400">1. CloneFactory.copy(command, dto)</text><path d="M 180,340 L 460,340" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="455" y="340" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="145.425" y="310" width="349.15" height="23" fill="white"/><text x="320.0" y="327" font-size="17" text-anchor="middle" font-weight="400">2. assign(actorId, userId, command)</text><path d="M 460,420 L 740,420" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="420" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="338.21500000000003" y="390" width="523.5699999999999" height="23" fill="white"/><text x="600.0" y="407" font-size="17" text-anchor="middle" font-weight="400">3. hasPermission(actorId, &quot;rbac&quot;, &quot;user.role.assign&quot;)</text><path d="M 740,480 L 460,480" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="546.55" y="450" width="106.89999999999999" height="23" fill="white"/><text x="600.0" y="467" font-size="17" text-anchor="middle" font-weight="400">4. allowed</text><rect x="35" y="520" width="1690" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="544" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="544" font-size="17" text-anchor="start" font-weight="400">[没有分配权限]</text><path d="M 460,590 L 180,590" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="179.34" y="560" width="281.32" height="23" fill="white"/><text x="320.0" y="577" font-size="17" text-anchor="middle" font-weight="400">5. ForbiddenException -&gt; 403</text><path d="M 460,690 L 1020,690" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="690" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="552.08" y="660" width="375.84" height="23" fill="white"/><text x="740.0" y="677" font-size="17" text-anchor="middle" font-weight="400">6. findById(actorId)；findById(userId)</text><path d="M 1020,750 L 460,750" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="572.565" y="720" width="334.87" height="23" fill="white"/><text x="740.0" y="737" font-size="17" text-anchor="middle" font-weight="400">7. actor、UserSnapshot（含角色 ID）</text><path d="M 460,860 L 740,860" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="735" y="860" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="502.945" y="830" width="194.10999999999999" height="23" fill="white"/><text x="600.0" y="847" font-size="17" text-anchor="middle" font-weight="400">8. findRole(roleId)</text><path d="M 740,915 L 460,915" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="457.98" y="885" width="284.03999999999996" height="23" fill="white"/><text x="600.0" y="902" font-size="17" text-anchor="middle" font-weight="400">9. 角色摘要（含 departmentId）</text><rect x="35" y="950" width="1690" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="974" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="974" font-size="17" text-anchor="start" font-weight="400">[用户或角色不存在]</text><path d="M 460,1020 L 180,1020" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="179.34" y="990" width="281.32" height="23" fill="white"/><text x="320.0" y="1007" font-size="17" text-anchor="middle" font-weight="400">10. NotFoundException -&gt; 404</text><path d="M 460,1080 L 555,1080 L 555,1115 L 460,1115" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="565" y="1083" width="426.66999999999996" height="23" fill="white"/><text x="570" y="1100" font-size="17" text-anchor="start" font-weight="400">11. User.restore(id, departmentId, roleIds)</text><path d="M 460,1170 L 1580,1170" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1575" y="1170" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="801.82" y="1140" width="436.35999999999996" height="23" fill="white"/><text x="1020.0" y="1157" font-size="17" text-anchor="middle" font-weight="400">12. requireSameDepartment(actor, user, role)</text><path d="M 460,1240 L 1300,1240" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1295" y="1240" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="725.91" y="1210" width="308.18" height="23" fill="white"/><text x="880.0" y="1227" font-size="17" text-anchor="middle" font-weight="400">13. assignRole(roleId)；检查重复</text><rect x="35" y="1300" width="1690" height="100" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="1324" font-size="17" text-anchor="start" font-weight="600">break</text><text x="125" y="1324" font-size="17" text-anchor="start" font-weight="400">[跨部门或重复分配]</text><path d="M 460,1370 L 180,1370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="218.015" y="1340" width="203.97" height="23" fill="white"/><text x="320.0" y="1357" font-size="17" text-anchor="middle" font-weight="400">14. 403 / 409；不保存</text><path d="M 460,1480 L 1020,1480" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1015" y="1480" width="10" height="30" fill="white" stroke="black" stroke-width="1.2"/><rect x="628.41" y="1450" width="223.17999999999998" height="23" fill="white"/><text x="740.0" y="1467" font-size="17" text-anchor="middle" font-weight="400">15. save(UserSnapshot)</text><path d="M 1020,1550 L 1115,1550 L 1115,1585 L 1020,1585" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="1125" y="1553" width="424.63" height="23" fill="white"/><text x="1130" y="1570" font-size="17" text-anchor="start" font-weight="400">16. 同步 user_role；CloneFactory 复制普通字段</text><path d="M 1020,1660 L 460,1660" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="681.62" y="1630" width="116.75999999999999" height="23" fill="white"/><text x="740.0" y="1647" font-size="17" text-anchor="middle" font-weight="400">17. 保存完成</text><path d="M 460,1770 L 180,1770" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="219.12" y="1740" width="201.76" height="23" fill="white"/><text x="320.0" y="1757" font-size="17" text-anchor="middle" font-weight="400">18. 事务提交后返回成功</text><rect x="55" y="1825" width="1650" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="70" y="1852" font-size="17" text-anchor="start" font-weight="400">应用层将共享快照重建为 User，再将聚合转回快照保存；基础设施不依赖 DDD 领域类型。</text><text x="70" y="1877" font-size="17" text-anchor="start" font-weight="400">应用服务检查访问权限与记录存在性；领域规则检查部门；User.assignRole 维护角色集合及防重。</text></svg>