ult</text><path d="M 445,750 L 90,750" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="146.4" y="715" width="272.2" height="26" fill="white"/><text x="282.5" y="735" font-size="20" text-anchor="middle" font-weight="400">200 StudentCoursePageVO</text><rect x="35" y="806" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="835" font-size="20" text-anchor="start" font-weight="400">学生页面按登录身份和学期显示课程。以同一学号在教师入口登录时，课程名册校验拒绝。</text></svg>