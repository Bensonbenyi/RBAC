<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1155" viewBox="0 0 900 1155"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">持久化读取与数据映射 顺序图</text><rect x="25" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="122" font-size="20" text-anchor="middle" font-weight="400">service:</text><text x="120" y="154" font-size="20" text-anchor="middle" font-weight="400">UserUseCase</text><path d="M 120,225 L 120,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="122" font-size="20" text-anchor="middle" font-weight="400">store:</text><text x="450" y="154" font-size="20" text-anchor="middle" font-weight="400">JpaManagement</text><text x="450" y="182" font-size="20" text-anchor="middle" font-weight="400">Store</text><path d="M 450,225 L 450,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="122" font-size="20" text-anchor="middle" font-weight="400">users:</text><text x="780" y="154" font-size="20" text-anchor="middle" font-weight="400">UserJpa</text><text x="780" y="182" font-size="20" text-anchor="middle" font-weight="400">Repository</text><path d="M 780,225 L 780,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="355" width="10" height="420" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,355 L 445,355" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="214.8" y="320" width="135.39999999999998" height="26" fill="white"/><text x="282.5" y="340" font-size="20" text-anchor="middle" font-weight="400">1: user(id)</text><rect x="775" y="495" width="10" height="140" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 450,495 L 775,495" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="522.0" y="460" width="180.99999999999997" height="26" fill="white"/><text x="612.5" y="480" font-size="20" text-anchor="middle" font-weight="400">2: findById(id)</text><path d="M 775,635 L 450,635" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="479.1" y="600" width="266.79999999999995" height="26" fill="white"/><text x="612.5" y="620" font-size="20" text-anchor="middle" font-weight="400">返回 UserEntity 或空结果</text><path d="M 445,775 L 120,775" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="124.80000000000001" y="740" width="315.4" height="26" fill="white"/><text x="282.5" y="760" font-size="20" text-anchor="middle" font-weight="400">返回 Data.User 或对象缺失错误</text><rect x="35" y="1035" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1064" font-size="20" text-anchor="start" font-weight="400">JPA 负责实体和表的映射，适配器把持久化实体转换为共享 Data。</text></svg>