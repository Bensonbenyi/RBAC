<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1195" viewBox="0 0 900 1195"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">AUTH-07 查询统一身份用户</text><rect x="15" y="76" width="150" height="96" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="90" y="131" font-size="20" text-anchor="middle" font-weight="400">obj: Caller</text><path d="M 90,172 L 90,1160" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="195" y="76" width="150" height="96" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="270" y="131" font-size="9" text-anchor="middle" font-weight="400">api: IdentityUserController</text><path d="M 270,172 L 270,1160" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="375" y="76" width="150" height="96" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="131" font-size="8" text-anchor="middle" font-weight="400">svc: IdentityDirectoryService</text><path d="M 450,172 L 450,1160" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="555" y="76" width="150" height="96" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="630" y="131" font-size="14" text-anchor="middle" font-weight="400">rbac: AccessPolicy</text><path d="M 630,172 L 630,1160" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="735" y="76" width="150" height="96" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="810" y="131" font-size="11" text-anchor="middle" font-weight="400">store: ManagementStore</text><path d="M 810,172 L 810,1160" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="85" y="305" width="10" height="770" rx="0" fill="white" stroke="black" stroke-width="1.4"/><rect x="265" y="325" width="10" height="725" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 95,325 L 265,325" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="31.100000000000023" y="290" width="317.79999999999995" height="26" fill="white"/><text x="190.0" y="310" font-size="20" text-anchor="middle" font-weight="400">1: GET /auth/users/{userId}</text><rect x="445" y="445" width="10" height="510" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,445 L 445,445" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="218.20000000000002" y="410" width="283.59999999999997" height="26" fill="white"/><text x="360.0" y="430" font-size="20" text-anchor="middle" font-weight="400">2: lookup(actor, userId)</text><rect x="625" y="570" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 455,570 L 625,570" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="375.40000000000003" y="505" width="329.19999999999993" height="26" fill="white"/><text x="540.0" y="525" font-size="20" text-anchor="middle" font-weight="400">3: granted = allowed(userId,</text><rect x="460.9" y="535" width="158.2" height="26" fill="white"/><text x="540.0" y="555" font-size="20" text-anchor="middle" font-weight="400">system, code)</text><rect x="805" y="720" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 455,720 L 805,720" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="501.0" y="685" width="237.99999999999997" height="26" fill="white"/><text x="620.0" y="705" font-size="20" text-anchor="middle" font-weight="400">4: result = user(id)</text><rect x="625" y="830" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 455,830 L 625,830" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="412.4" y="765" width="255.2" height="26" fill="white"/><text x="540.0" y="785" font-size="20" text-anchor="middle" font-weight="400">5: [平台] scope(actor,</text><rect x="460.9" y="795" width="158.2" height="26" fill="white"/><text x="540.0" y="815" font-size="20" text-anchor="middle" font-weight="400">departmentId)</text><path d="M 445,955 L 275,955" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="315.0" y="920" width="90" height="26" fill="white"/><text x="360.0" y="940" font-size="20" text-anchor="middle" font-weight="400">查询结果</text><path d="M 265,1050 L 95,1050" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="122.2" y="1015" width="135.6" height="26" fill="white"/><text x="190.0" y="1035" font-size="20" text-anchor="middle" font-weight="400">200 目录响应</text><rect x="35" y="1110" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1139" font-size="20" text-anchor="start" font-weight="400">课程使用 TEC，平台使用已有目录权限。无权限返回 403。 用户不存在返回</text><text x="50" y="1164" font-size="20" text-anchor="start" font-weight="400">IDENTITY_USER_NOT_FOUND。</text></svg>