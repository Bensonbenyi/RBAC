 y="428" font-size="20" text-anchor="middle" font-weight="400">3: 通过链路 检查当前令牌和系统登录许可</text><rect x="790" y="515" width="10" height="110" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 570,515 L 790,515" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="496.6" y="480" width="366.79999999999995" height="26" fill="white"/><text x="680.0" y="500" font-size="20" text-anchor="middle" font-weight="400">4: 查询 UI 码或校验 TEC 并查询目录</text><path d="M 790,625 L 570,625" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="529.4" y="590" width="301.2" height="26" fill="white"/><text x="680.0" y="610" font-size="20" text-anchor="middle" font-weight="400">allowed 或部门及候选用户分页</text><path d="M 330,735 L 105,735" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="75.5" y="700" width="284.0" height="26" fill="white"/><text x="217.5" y="720" font-size="20" text-anchor="middle" font-weight="400">HTTP JSON 与允许来源响应头</text><rect x="35" y="799" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="828" font-size="20" text-anchor="start" font-weight="400">前端直连权限平台。预检校验来源和请求头，正式请求按当前 RBAC 授权处理。</text></svg>