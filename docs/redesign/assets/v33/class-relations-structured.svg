-size="16" text-anchor="start" font-weight="400">+ userRoles()</text><text x="640" y="1029" font-size="16" text-anchor="start" font-weight="400">+ rolePermissions()</text><text x="640" y="1057" font-size="16" text-anchor="start" font-weight="400">+ assignRole()</text><text x="640" y="1085" font-size="16" text-anchor="start" font-weight="400">+ revokeRole()</text><text x="640" y="1113" font-size="16" text-anchor="start" font-weight="400">+ grantPermission()</text><text x="640" y="1141" font-size="16" text-anchor="start" font-weight="400">+ revokePermission()</text><rect x="30" y="900" width="470" height="174" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="265.0" y="922" font-size="16" text-anchor="middle" font-weight="400">«interface»</text><text x="265.0" y="947" font-size="18" text-anchor="middle" font-weight="600">RoleUseCase</text><path d="M 30,960 L 500,960" fill="none" stroke="black" stroke-width="1.4"/><path d="M 30,976 L 500,976" fill="none" stroke="black" stroke-width="1.4"/><text x="40" y="1001" font-size="16" text-anchor="start" font-weight="400">+ permissions()</text><text x="40" y="1029" font-size="16" text-anchor="start" font-weight="400">+ grant()</text><text x="40" y="1057" font-size="16" text-anchor="start" font-weight="400">+ revoke()</text><path d="M 500,190 L 630,190" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="552" y="174" font-size="15" text-anchor="start" font-weight="400">-service</text><path d="M 855,465 L 855,304" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#triangle)"/><path d="M 265,629 L 265,890" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#triangle)"/><path d="M 855,629 L 855,890" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="867" y="874" font-size="15" text-anchor="start" font-weight="400">-store</text><path d="M 505,570 L 549.0,570.0 Q 565,570 565.0,586.0 L 565.0,804.0 Q 565,820 581.0,820.0 L 754.0,820.0 Q 770,820 770.0,836.0 L 770,890" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="782" y="874" font-size="15" text-anchor="start" font-weight="400">-store</text><rect x="30" y="1240" width="1050" height="111" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="45" y="1269" font-size="20" text-anchor="start" font-weight="400">用户角色和角色权限分别由两张 M:N 关联表保存；角色归属一个部门。</text><text x="45" y="1298" font-size="20" text-anchor="start" font-weight="400">结构化服务在事务内检查权限、范围、对象存在性和关系后调用存储端口。</text><text x="45" y="1327" font-size="20" text-anchor="start" font-weight="400">RoleController 通过 RoleUseCase 调用角色权限方法，详见角色模块类图。</text></svg>