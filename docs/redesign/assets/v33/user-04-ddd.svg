 width="294.99999999999994" height="26" fill="white"/><text x="450.0" y="775" font-size="20" text-anchor="middle" font-weight="400">5: changeProfile(command)</text><path d="M 565,885 L 335,885" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="290.8" y="850" width="318.4" height="26" fill="white"/><text x="450.0" y="870" font-size="20" text-anchor="middle" font-weight="400">6: 更新后的领域状态 / 业务异常</text><rect x="790" y="985" width="10" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,985 L 795,985" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="411.8" y="950" width="306.4" height="26" fill="white"/><text x="565.0" y="970" font-size="20" text-anchor="middle" font-weight="400">7: updateUser(id, profile)</text><path d="M 795,1055 L 335,1055" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="492.9" y="1020" width="144.2" height="26" fill="white"/><text x="565.0" y="1040" font-size="20" text-anchor="middle" font-weight="400">8: 持久化结果</text><path d="M 335,1125 L 105,1125" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="180.8" y="1090" width="78.39999999999999" height="26" fill="white"/><text x="220.0" y="1110" font-size="20" text-anchor="middle" font-weight="400">9: 204</text><rect x="35" y="1195" width="830" height="103" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1224" font-size="20" text-anchor="start" font-weight="400">应用服务先执行 AccessPolicy</text><text x="50" y="1249" font-size="20" text-anchor="start" font-weight="400">权限与部门检查；本人资料使用当前身份。领域对象维护状态，存储端口保存变化；写失败</text><text x="50" y="1274" font-size="20" text-anchor="start" font-weight="400">回滚。</text></svg>