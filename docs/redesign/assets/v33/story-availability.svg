ite"/><text x="447.5" y="561" font-size="20" text-anchor="middle" font-weight="400">返回认证身份</text><path d="M 330,662 L 105,662" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="69.69999999999999" y="627" width="295.6" height="26" fill="white"/><text x="217.5" y="647" font-size="20" text-anchor="middle" font-weight="400">请求继续；依赖故障时返回 503</text><rect x="35" y="726" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="755" font-size="20" text-anchor="start" font-weight="400">效用树叶 U-A1，需求 REQ-N-03；记录恢复时长，并核对会话和数据完整性。</text></svg>