<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1155" viewBox="0 0 900 1155"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">S3 可用性 应用重启后的会话验证</text><rect x="10" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="122" font-size="20" text-anchor="middle" font-weight="400">client:</text><text x="105" y="154" font-size="20" text-anchor="middle" font-weight="400">ClientModule</text><path d="M 105,225 L 105,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="122" font-size="20" text-anchor="middle" font-weight="400">auth:</text><text x="335" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthModule</text><path d="M 335,225 L 335,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="122" font-size="20" text-anchor="middle" font-weight="400">sessions:</text><text x="565" y="154" font-size="20" text-anchor="middle" font-weight="400">SessionModule</text><path d="M 565,225 L 565,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="122" font-size="20" text-anchor="middle" font-weight="400">db:</text><text x="795" y="154" font-size="20" text-anchor="middle" font-weight="400">MySQL</text><path d="M 795,225 L 795,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 105,345 L 335,345" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="52.30000000000001" y="310" width="335.4" height="26" fill="white"/><text x="220.0" y="330" font-size="20" text-anchor="middle" font-weight="400">1: 应用恢复后携带原 Bearer 请求</text><path d="M 335,460 L 565,460" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="337.9" y="425" width="224.2" height="26" fill="white"/><text x="450.0" y="445" font-size="20" text-anchor="middle" font-weight="400">2: 验签并读取对应会话</text><path d="M 565,575 L 795,575" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="517.9" y="540" width="324.2" height="26" fill="white"/><text x="680.0" y="560" font-size="20" text-anchor="middle" font-weight="400">3: 查询会话、账号及目标系统权限</text><path d="M 795,690 L 565,690" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="567.9" y="655" width="224.2" height="26" fill="white"/><text x="680.0" y="675" font-size="20" text-anchor="middle" font-weight="400">4: 有效且未撤销的会话</text><path d="M 565,805 L 335,805" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="367.9" y="770" width="164.2" height="26" fill="white"/><text x="450.0" y="790" font-size="20" text-anchor="middle" font-weight="400">5: 返回认证身份</text><path d="M 335,920 L 105,920" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="55.099999999999994" y="885" width="329.8" height="26" fill="white"/><text x="220.0" y="905" font-size="20" text-anchor="middle" font-weight="400">6: 请求继续；依赖故障时返回 503</text><rect x="35" y="1055" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1084" font-size="20" text-anchor="start" font-weight="400">效用树叶 U-A1，需求 REQ-N-03；记录恢复时长，并核对会话和数据完整性。</text></svg>