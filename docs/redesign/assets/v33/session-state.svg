<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">登录会话状态设计</text><circle cx="450" cy="135" r="15" fill="black"/><rect x="270" y="280" width="360" height="130" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450.0" y="311" font-size="22" text-anchor="middle" font-weight="600">有效</text><text x="450.0" y="343" font-size="18" text-anchor="middle" font-weight="400">未撤销且当前时间早于 expiresAt</text><rect x="40" y="650" width="360" height="130" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="220.0" y="681" font-size="22" text-anchor="middle" font-weight="600">已撤销</text><text x="220.0" y="713" font-size="18" text-anchor="middle" font-weight="400">revokedAt 非空</text><rect x="500" y="650" width="360" height="130" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="680.0" y="681" font-size="22" text-anchor="middle" font-weight="600">已过期</text><text x="680.0" y="713" font-size="18" text-anchor="middle" font-weight="400">当前时间达到 expiresAt</text><path d="M 450,155 L 450,270" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="475" y="220" font-size="19" text-anchor="start" font-weight="400">登录校验通过 / 保存会话</text><path d="M 350,415 L 220,640" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="80" y="520" font-size="20" text-anchor="start" font-weight="400">logout / 记录撤销时间</text><path d="M 550,415 L 680,640" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="610" y="520" font-size="20" text-anchor="start" font-weight="400">at(expiresAt)</text><rect x="60" y="850" width="780" height="82" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="75" y="879" font-size="20" text-anchor="start" font-weight="400">状态由撤销时间和过期时间推导；不增加业务用户状态。</text><text x="75" y="908" font-size="20" text-anchor="start" font-weight="400">已撤销和已过期均拒绝认证。删除用户同时清理其会话。</text></svg>