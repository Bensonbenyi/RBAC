<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1175" viewBox="0 0 900 1175"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">AUTH-05 共享 检查操作权限</text><rect x="10" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="122" font-size="20" text-anchor="middle" font-weight="400">client:</text><text x="105" y="154" font-size="20" text-anchor="middle" font-weight="400">Browser</text><path d="M 105,225 L 105,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="335" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthController</text><path d="M 335,225 L 335,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="122" font-size="20" text-anchor="middle" font-weight="400">service:</text><text x="565" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthService</text><path d="M 565,225 L 565,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="122" font-size="20" text-anchor="middle" font-weight="400">store:</text><text x="795" y="154" font-size="20" text-anchor="middle" font-weight="400">ManagementStore</text><path d="M 795,225 L 795,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="330" y="335" width="10" height="640" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,335 L 335,335" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="4.100000000000023" y="300" width="431.79999999999995" height="26" fill="white"/><text x="220.0" y="320" font-size="20" text-anchor="middle" font-weight="400">1: GET /auth/permissions/{permission}</text><rect x="560" y="445" width="10" height="470" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,445 L 565,445" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="259.5" y="410" width="381.0" height="26" fill="white"/><text x="450.0" y="430" font-size="20" text-anchor="middle" font-weight="400">2: allowed(校验后的输入 / 当前身份)</text><rect x="790" y="595" width="10" height="180" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 565,595 L 795,595" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="503.9" y="530" width="352.2" height="26" fill="white"/><text x="680.0" y="550" font-size="20" text-anchor="middle" font-weight="400">3: permissionsForUser(当前用户,</text><rect x="629.3" y="560" width="101.4" height="26" fill="white"/><text x="680.0" y="580" font-size="20" text-anchor="middle" font-weight="400">当前系统)</text><path d="M 795,805 L 565,805" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="523.7" y="770" width="312.59999999999997" height="26" fill="white"/><text x="680.0" y="790" font-size="20" text-anchor="middle" font-weight="400">4: 当前数据 / 更新结果 / 异常</text><path d="M 565,935 L 335,935" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="357.9" y="900" width="184.2" height="26" fill="white"/><text x="450.0" y="920" font-size="20" text-anchor="middle" font-weight="400">5: 结果或业务错误</text><path d="M 335,1005 L 105,1005" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="135.20000000000002" y="970" width="169.59999999999997" height="26" fill="white"/><text x="220.0" y="990" font-size="20" text-anchor="middle" font-weight="400">6: 200 allowed</text><rect x="35" y="1075" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1104" font-size="20" text-anchor="start" font-weight="400">BearerFilter 已检查签名、会话、账号及目标系统 login；权限从当前关联读取。</text></svg>