t><rect x="630" y="1025" width="450" height="111" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="645" y="1054" font-size="20" text-anchor="start" font-weight="400">Role 维护名称；权限关系由关联表保存。</text><text x="645" y="1083" font-size="20" text-anchor="start" font-weight="400">Data 保存编号、归属等只读契约。</text><text x="645" y="1112" font-size="20" text-anchor="start" font-weight="400">跨聚合的对象范围由应用服务检查。</text><rect x="40" y="1530" width="470" height="118" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="275.0" y="1552" font-size="16" text-anchor="middle" font-weight="400">«domain rule»</text><text x="275.0" y="1577" font-size="18" text-anchor="middle" font-weight="600">RoleHierarchy</text><path d="M 40,1590 L 510,1590" fill="none" stroke="black" stroke-width="1.4"/><path d="M 40,1606 L 510,1606" fill="none" stroke="black" stroke-width="1.4"/><text x="50" y="1631" font-size="16" text-anchor="start" font-weight="400">+ requireAcyclic()</text><path d="M 50,1635 L 232,1635" fill="none" stroke="black" stroke-width="1.4"/><rect x="630" y="1530" width="450" height="140" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="855.0" y="1552" font-size="16" text-anchor="middle" font-weight="400">«record»</text><text x="855.0" y="1577" font-size="18" text-anchor="middle" font-weight="600">Data.Inheritance</text><path d="M 630,1590 L 1080,1590" fill="none" stroke="black" stroke-width="1.4"/><text x="640" y="1614" font-size="16" text-anchor="start" font-weight="400">- seniorRoleId: Long</text><text x="640" y="1639" font-size="16" text-anchor="start" font-weight="400">- juniorRoleId: Long</text><path d="M 630,1654 L 1080,1654" fill="none" stroke="black" stroke-width="1.4"/><path d="M 515,1610 L 620,1610" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="40" y="1760" width="1040" height="82" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="55" y="1789" font-size="20" text-anchor="start" font-weight="400">RoleHierarchy 读取本次操作的部门继承边，检查从基础角色能否走回高级角色。</text><text x="55" y="1818" font-size="20" text-anchor="start" font-weight="400">应用服务负责事务、部门锁与持久化，领域规则负责图的无环性。</text></svg>