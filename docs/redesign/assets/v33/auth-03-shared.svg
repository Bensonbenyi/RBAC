ke-dasharray="7 5" marker-end="url(#open)"/><rect x="375.0" y="900" width="150" height="26" fill="white"/><text x="450.0" y="920" font-size="20" text-anchor="middle" font-weight="400">结果或业务错误</text><path d="M 330,1005 L 105,1005" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="195.4" y="970" width="44.199999999999996" height="26" fill="white"/><text x="217.5" y="990" font-size="20" text-anchor="middle" font-weight="400">204</text><rect x="35" y="1075" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1104" font-size="20" text-anchor="start" font-weight="400">撤销当前会话，后续请求由 BearerFilter 拒绝。</text></svg>