><text x="655" y="685" font-size="20" text-anchor="start" font-weight="400">4: copyNotNull(当前资料,</text><rect x="650" y="695" width="101.19999999999999" height="26" fill="white"/><text x="655" y="715" font-size="20" text-anchor="start" font-weight="400">command)</text><rect x="790" y="835" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 570,835 L 790,835" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="469.8" y="800" width="420.4" height="26" fill="white"/><text x="680.0" y="820" font-size="20" text-anchor="middle" font-weight="400">5: updateUser(actor.userId, profile)</text><path d="M 560,935 L 340,935" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="405.0" y="900" width="90" height="26" fill="white"/><text x="450.0" y="920" font-size="20" text-anchor="middle" font-weight="400">更新完成</text><path d="M 330,1005 L 105,1005" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="195.4" y="970" width="44.199999999999996" height="26" fill="white"/><text x="217.5" y="990" font-size="20" text-anchor="middle" font-weight="400">204</text><rect x="35" y="1075" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1104" font-size="20" text-anchor="start" font-weight="400">本人编号来自认证上下文；资料仅含姓名和手机号。</text></svg>