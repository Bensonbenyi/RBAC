<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1175" viewBox="0 0 900 1175"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">建立登录会话与签发凭据</text><rect x="25" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="122" font-size="20" text-anchor="middle" font-weight="400">auth:</text><text x="120" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthService</text><path d="M 120,225 L 120,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="122" font-size="20" text-anchor="middle" font-weight="400">sessions:</text><text x="450" y="154" font-size="20" text-anchor="middle" font-weight="400">SessionStore</text><path d="M 450,225 L 450,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="122" font-size="20" text-anchor="middle" font-weight="400">encoder:</text><text x="780" y="154" font-size="20" text-anchor="middle" font-weight="400">JwtEncoder</text><path d="M 780,225 L 780,1140" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="355" width="10" height="120" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,355 L 450,355" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="34.900000000000034" y="320" width="500.19999999999993" height="26" fill="white"/><text x="285.0" y="340" font-size="20" text-anchor="middle" font-weight="400">1: save(UUID, userId, systemKey, expiresAt)</text><path d="M 450,495 L 120,495" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="182.9" y="460" width="204.2" height="26" fill="white"/><text x="285.0" y="480" font-size="20" text-anchor="middle" font-weight="400">2: 会话写入当前事务</text><rect x="775" y="645" width="10" height="150" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,645 L 780,645" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="211.30000000000004" y="610" width="477.3999999999999" height="26" fill="white"/><text x="450.0" y="630" font-size="20" text-anchor="middle" font-weight="400">3: encode(RS256, iss/sub/aud/jti/iat/exp)</text><path d="M 780,825 L 120,825" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="342.4" y="790" width="215.2" height="26" fill="white"/><text x="450.0" y="810" font-size="20" text-anchor="middle" font-weight="400">4: JWT accessToken</text><path d="M 125,935 L 185,935 L 185,967 L 130,967" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="205" y="900" width="321.0" height="26" fill="white"/><text x="210" y="920" font-size="20" text-anchor="start" font-weight="400">5: 返回 LoginResult；事务提交</text><rect x="35" y="1065" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1094" font-size="20" text-anchor="start" font-weight="400">账号及目标系统 login 权限先校验。签发失败时回滚会话写入；成功响应包含</text><text x="50" y="1119" font-size="20" text-anchor="start" font-weight="400">accessToken、tokenType、expiresIn。</text></svg>