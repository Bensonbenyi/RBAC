<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1315" viewBox="0 0 900 1315"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">AUTH-04 DDD 修改本人资料</text><rect x="10" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="105" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthController</text><path d="M 105,225 L 105,1280" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="122" font-size="20" text-anchor="middle" font-weight="400">app:</text><text x="335" y="154" font-size="20" text-anchor="middle" font-weight="400">DddUserService</text><path d="M 335,225 L 335,1280" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="595" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="617" font-size="20" text-anchor="middle" font-weight="400">domain:</text><text x="565" y="649" font-size="20" text-anchor="middle" font-weight="400">User</text><path d="M 565,720 L 565,1280" fill="none" strok