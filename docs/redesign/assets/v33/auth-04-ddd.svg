nd="url(#filled)"/><rect x="302.5" y="755" width="294.99999999999994" height="26" fill="white"/><text x="450.0" y="775" font-size="20" text-anchor="middle" font-weight="400">4: changeProfile(command)</text><path d="M 560,885 L 340,885" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="348.0" y="850" width="204.0" height="26" fill="white"/><text x="450.0" y="870" font-size="20" text-anchor="middle" font-weight="400">更新后的 profile()</text><rect x="790" y="985" width="10" height="70" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 340,985 L 790,985" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="354.8" y="950" width="420.4" height="26" fill="white"/><text x="565.0" y="970" font-size="20" text-anchor="middle" font-weight="400">5: updateUser(actor.userId, profile)</text><path d="M 790,1055 L 340,1055" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="510.0" y="1020" width="110" height="26" fill="white"/><text x="565.0" y="1040" font-size="20" text-anchor="middle" font-weight="400">持久化完成</text><path d="M 330,1125 L 105,1125" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="195.4" y="1090" width="44.199999999999996" height="26" fill="white"/><text x="217.5" y="1110" font-size="20" text-anchor="middle" font-weight="400">204</text><rect x="35" y="1195" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1224" font-size="20" text-anchor="start" font-weight="400">本人编号来自认证上下文。User 保留未提交的字段，应用服务保存资料。</text></svg>