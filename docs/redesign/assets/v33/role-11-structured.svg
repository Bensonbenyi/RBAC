" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,535 L 625,535" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="239.8" y="500" width="420.4" height="26" fill="white"/><text x="450.0" y="520" font-size="20" text-anchor="middle" font-weight="400">3: lockHierarchy(actor.departmentId)</text><rect x="625" y="640" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,640 L 625,640" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="292.5" y="605" width="314.99999999999994" height="26" fill="white"/><text x="450.0" y="625" font-size="20" text-anchor="middle" font-weight="400">4: role(id)；role(juniorId)</text><rect x="445" y="745" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,745 L 445,745" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="269.5" y="680" width="180.99999999999997" height="26" fill="white"/><text x="360.0" y="700" font-size="20" text-anchor="middle" font-weight="400">5: scope(actor,</text><rect x="215.20000000000002" y="710" width="289.59999999999997" height="26" fill="white"/><text x="360.0" y="730" font-size="20" text-anchor="middle" font-weight="400">每个目标角色.departmentId)</text><rect x="625" y="850" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,850 L 625,850" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="177.10000000000002" y="815" width="545.8" height="26" fill="white"/><text x="450.0" y="835" font-size="20" text-anchor="middle" font-weight="400">6: edges = inheritanceEdges(actor.departmentId)</text><rect x="805" y="955" width="10" height="75" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 275,955 L 805,955" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="308.40000000000003" y="920" width="443.199