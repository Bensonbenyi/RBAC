ssions/</text><rect x="388.0" y="376" width="123.99999999999999" height="26" fill="white"/><text x="450.0" y="396" font-size="20" text-anchor="middle" font-weight="400">updateTerm</text><path d="M 560,460 L 340,460" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="269.5" y="425" width="361.0" height="26" fill="white"/><text x="450.0" y="445" font-size="20" text-anchor="middle" font-weight="400">allowed；拒绝 403；依赖不可用 503</text><rect x="790" y="521" width="10" height="52" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 340,521 L 790,521" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="430.20000000000005" y="486" width="269.59999999999997" height="26" fill="white"/><text x="565.0" y="506" font-size="20" text-anchor="middle" font-weight="400">4: 允许后执行 updateTerm</text><path d="M 790,573 L 340,573" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="500.0" y="538" width="130" height="26" fill="white"/><text x="565.0" y="558" font-size="20" text-anchor="middle" font-weight="400">业务处理结果</text><path d="M 330,625 L 105,625" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="138.3" y="590" width="158.39999999999998" height="26" fill="white"/><text x="217.5" y="610" font-size="20" text-anchor="middle" font-weight="400">返回 HTTP 响应</text><rect x="35" y="668" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="697" font-size="20" text-anchor="start" font-weight="400">课程服务保留上游的输入、对象和状态校验；平台权限在每次请求时读取。</text></svg>