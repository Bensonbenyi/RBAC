" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="325" width="10" height="600" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,325 L 445,325" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="75.10000000000002" y="290" width="414.79999999999995" height="26" fill="white"/><text x="282.5" y="310" font-size="20" text-anchor="middle" font-weight="400">1: 继续 inherit(actor, id, juniorId)</text><path d="M 455,465 L 685,465" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="430.1" y="430" width="374.79999999999995" height="26" fill="white"/><text x="617.5" y="450" font-size="20" text-anchor="middle" font-weight="400">2: «create» RoleHierarchy(edges)</text><rect x="775" y="655" width="10" height="110" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 455,655 L 775,655" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="433.3" y="620" width="363.4" height="26" fill="white"/><text x="615.0" y="640" font-size="20" text-anchor="middle" font-weight="400">3: requireAcyclic(id, juniorId)</text><rect x="35" y="710" width="830" height="90" fill="none" stroke="black"/><path d="M 35,740 L 82.0,740.0 Q 98,740 103.0,735.0 L 108.0,730.0 Q 113,725 113.0,720.0 L 113,710" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="732" font-size="17" text-anchor="start" font-weight="600">break</text><rect x="125" y="718" width="284.38" height="23" fill="white"/><text x="130" y="735" font-size="17" text-anchor="start" font-weight="400">[基础角色可达高级角色或二者相同]</text><path d="M 775,765 L 455,765" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="484.6" y="730" width="260.79999999999995" height="26" fill="white"/><text x="615.0" y="750" font-size="20" text-anchor="middle" font-weight="400">«exception» ROLE_CYCLE</text><path d="M 445,925 L 120,925" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="167.5" y="890" width="230" height="26" fill="white"/><text x="282.5" y="910" font-size="20" text-anchor="middle" font-weight="400">检查完成；或抛异常回滚</text><rect x="35" y="1005" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1034" font-size="20" text-anchor="start" font-weight="400">领域对象持有不可变边快照，沿高级到基础方向遍历，维护无环规则。</text></svg>