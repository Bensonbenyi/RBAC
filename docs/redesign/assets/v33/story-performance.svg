<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1155" viewBox="0 0 900 1155"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">S2 性能 并发鉴权</text><rect x="10" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="122" font-size="20" text-anchor="middle" font-weight="400">client:</text><text x="105" y="154" font-size="20" text-anchor="middle" font-weight="400">ClientModule</text><path d="M 105,225 L 105,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="335" y="154" font-size="20" text-anchor="middle" font-weight="400">AuthModule</text><path d="M 335,225 L 335,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="122" font-size="20" text-anchor="middle" font-weight="400">rbac:</text><text x="565" y="154" font-size="20" text-anchor="middle" font-weight="400">Authorization</text><text x="565" y="182" font-size="20" text-anchor="middle" font-weight="400">Module</text><path d="M 565,225 L 565,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="122" font-size="20" text-anchor="middle" font-weight="400">db:</text><text x="795" y="154" font-size="20" text-anchor="middle" font-weight="400">MySQL</text><path d="M 795,225 L 795,1120" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="330" y="345" width="10" height="575" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,345 L 330,345" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="65.4" y="310" width="304.2" height="26" fill="white"/><text x="217.5" y="330" font-size="20" text-anchor="middle" font-weight="400">1: 同一负载下提交并发权限查询</text><rect x="560" y="460" width="10" height="345" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,460 L 560,460" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="335.4" y="425" width="224.2" height="26" fill="white"/><text x="447.5" y="445" font-size="20" text-anchor="middle" font-weight="400">2: 校验身份并查询权限</text><rect x="790" y="575" width="10" height="115" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 565,575 L 790,575" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="515.4" y="540" width="324.2" height="26" fill="white"/><text x="677.5" y="560" font-size="20" text-anchor="middle" font-weight="400">3: 通过有界连接池和关联索引查询</text><path d="M 790,690 L 565,690" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="612.5" y="655" width="130" height="26" fill="white"/><text x="677.5" y="675" font-size="20" text-anchor="middle" font-weight="400">当前授权集合</text><path d="M 560,805 L 335,805" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="362.5" y="770" width="170" height="26" fill="white"/><text x="447.5" y="790" font-size="20" text-anchor="middle" font-weight="400">生成布尔许可结果</text><path d="M 330,920 L 105,920" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="122.5" y="885" width="190" height="26" fill="white"/><text x="217.5" y="905" font-size="20" text-anchor="middle" font-weight="400">返回结果并记录耗时</text><rect x="35" y="1055" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1084" font-size="20" text-anchor="start" font-weight="400">效用树叶 U-P1，需求 REQ-N-02；记录吞吐量、P95、错误率和内存。</text></svg>