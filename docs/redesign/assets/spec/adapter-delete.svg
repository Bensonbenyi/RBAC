xt><path d="M 450,855 L 120,855" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="202.9" y="820" width="164.2" height="26" fill="white"/><text x="285.0" y="840" font-size="20" text-anchor="middle" font-weight="400">6: 用户删除完成</text><rect x="35" y="915" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="944" font-size="20" text-anchor="start" font-weight="400">同一事务依次删除 user_role 和</text><text x="50" y="969" font-size="20" text-anchor="start" font-weight="400">app_user；任一步或提交失败全部回滚。适配器记录操作和耗时，异常统一映射。</text></svg>