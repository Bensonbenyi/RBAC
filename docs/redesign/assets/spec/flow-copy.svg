<svg xmlns="http://www.w3.org/2000/svg" width="900" height="845" viewBox="0 0 900 845"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">API 边界对象拷贝 顺序图</text><rect x="25" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="120" y="154" font-size="20" text-anchor="middle" font-weight="400">UserController</text><path d="M 120,225 L 120,810" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="122" font-size="20" text-anchor="middle" font-weight="400">factory:</text><text x="450" y="154" font-size="20" text-anchor="middle" font-weight="400">CloneFactory</text><path d="M 450,225 L 450,810" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="122" font-size="20" text-anchor="middle" font-weight="400">service:</text><text x="780" y="154" font-size="20" text-anchor="middle" font-weight="400">UserUseCase</text><path d="M 780,225 L 780,810" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="295" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,295 L 450,295" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="160.3" y="260" width="249.39999999999998" height="26" fill="white"/><text x="285.0" y="280" font-size="20" text-anchor="middle" font-weight="400">1: copy(command, dto)</text><path d="M 450,370 L 120,370" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="187.3" y="335" width="195.39999999999998" height="26" fill="white"/><text x="285.0" y="355" font-size="20" text-anchor="middle" font-weight="400">2: 白名单 Command</text><rect x="775" y="495" width="10" height="65" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,495 L 780,495" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="313.9" y="460" width="272.2" height="26" fill="white"/><text x="450.0" y="480" font-size="20" text-anchor="middle" font-weight="400">3: create(actorId, cmd)</text><path d="M 780,585 L 120,585" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="393.7" y="550" width="112.6" height="26" fill="white"/><text x="450.0" y="570" font-size="20" text-anchor="middle" font-weight="400">4: Result</text><rect x="445" y="700" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,700 L 450,700" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="171.70000000000002" y="665" width="226.59999999999997" height="26" fill="white"/><text x="285.0" y="685" font-size="20" text-anchor="middle" font-weight="400">5: copy(vo, result)</text><rect x="35" y="775" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="804" font-size="20" text-anchor="start" font-weight="400">actorId 来自会话；主键、部门和授权关系由专用操作设置。<