ack" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="265" width="10" height="410" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,265 L 450,265" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="148.9" y="230" width="272.2" height="26" fill="white"/><text x="285.0" y="250" font-size="20" text-anchor="middle" font-weight="400">1: list(actorId, query)</text><rect x="775" y="400" width="10" height="130" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 450,400 L 780,400" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="421.90000000000003" y="365" width="386.19999999999993" height="26" fill="white"/><text x="615.0" y="385" font-size="20" text-anchor="middle" font-weight="400">2: result = query(actorId, query)</text><path d="M 780,550 L 450,550" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="492.9" y="515" width="244.2" height="26" fill="white"/><text x="615.0" y="535" font-size="20" text-anchor="middle" font-weight="400">3: 按范围过滤的查询数据</text><path d="M 450,675 L 120,675" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="96.0" y="640" width="378.0" height="26" fill="white"/><text x="285.0" y="660" font-size="20" text-anchor="middle" font-weight="400">4: Result；API 拷贝为 VO，返回 200</text><rect x="35" y="715" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="744" font-size="20" text-anchor="start" font-weight="400">分页读取系统目录。端口绑定启动配置选中的实现；失败按统一异常映射返回。</text></svg>