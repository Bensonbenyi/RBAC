<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1285" viewBox="0 0 900 1285"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">修改权限 DDD顺序图</text><rect x="10" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="105" y="154" font-size="20" text-anchor="middle" font-weight="400">Permission</text><text x="105" y="182" font-size="20" text-anchor="middle" font-weight="400">Controller</text><path d="M 105,225 L 105,1250" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="122" font-size="20" text-anchor="middle" font-weight="400">service:</text><text x="335" y="154" font-size="20" text-anchor="middle" font-weight="400">DddPermission</text><text x="335" y="182" font-size="20" text-anchor="middle" font-weight="400">Service</text><path d="M 335,225 L 335,1250" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="122" font-size="20" text-anchor="middle" font-weight="400">store:</text><text x="565" y="154" font-size="20" text-anchor="middle" font-weight="400">PermissionStore</text><path d="M 565,225 L 565,1250" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="495" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="517" font-size="20" text-anchor="middle" font-weight="400">entity:</text><text x="795" y="549" font-size="20" text-anchor="middle" font-weight="400">Permission</text><path d="M 795,620 L 795,1250" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="330" y="285" width="10" height="850" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,285 L 335,285" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="83.9" y="250" width="272.2" height="26" fill="white"/><text x="220.0" y="270" font-size="20" text-anchor="middle" font-weight="400">1: update(actorId, cmd)</text><rect x="560" y="390" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,390 L 565,390" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="234.10000000000002" y="355" width="431.79999999999995" height="26" fill="white"/><text x="450.0" y="375" font-size="20" text-anchor="middle" font-weight="400">2: data = loadForChange(actorId, cmd)</text><path d="M 565,445 L 335,445" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="275.1" y="410" width="349.8" height="26" fill="white"/><text x="450.0" y="430" font-size="20" text-anchor="middle" font-weight="400">3: data（目标、归属、关系与引用）</text><path d="M 335,540 L 700,540" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="451.70000000000005" y="505" width="226.59999999999997" height="26" fill="white"/><text x="565.0" y="525" font-size="20" text-anchor="middle" font-weight="400">4: Permission(data)</text><rect x="790" y="670" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,670 L 795,670" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="480.20000000000005" y="635" width="169.59999999999997" height="26" fill="white"/><text x="565.0" y="655" font-size="20" text-anchor="middle" font-weight="400">5: change(cmd)</text><rect x="35" y="750" width="830" height="100" fill="none" stroke="black"/><path d="M 35,780 L 82.0,780.0 Q 98,780 103.0,775.0 L 108.0,770.0 Q 113,765 113.0,760.0 L 113,750" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="772" font-size="17" text-anchor="start" font-weight="600">break</text><rect x="125" y="758" width="97.38" height="23" fill="white"/><text x="130" y="775" font-size="17" text-anchor="start" font-weight="400">[校验失败]</text><path d="M 335,830 L 105,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="60.80000000000001" y="795" width="318.4" height="26" fill="white"/><text x="220.0" y="815" font-size="20" text-anchor="middle" font-weight="400">6: 抛出业务异常；4xx，事务回滚</text><rect x="560" y="975" width="10" height="60" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,975 L 565,975" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="319.6" y="940" width="260.79999999999995" height="26" fill="white"/><text x="450.0" y="960" font-size="20" text-anchor="middle" font-weight="400">7: update(changedData)</text><path d="M 335,1135 L 105,1135" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="107.9" y="1100" width="224.2" height="26" fill="white"/><text x="220.0" y="1120" font-size="20" text-anchor="middle" font-weight="400">8: 事务提交后返回结果</text><rect x="35" y="1185" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1214" font-size="20" text-anchor="start" font-weight="400">事务覆盖加载至提交。仅修改 name；systemId、code 固定。</text></svg>