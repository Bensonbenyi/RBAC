<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">受保护请求 校验顺序图</text><rect x="10" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="124" font-size="18" text-anchor="middle" font-weight="400">api:</text><text x="105" y="147" font-size="17" text-anchor="middle" font-weight="400">RequestGuard</text><path d="M 105,190 L 105,1065" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="124" font-size="18" text-anchor="middle" font-weight="400">session:</text><text x="335" y="147" font-size="17" text-anchor="middle" font-weight="400">SessionFacade</text><path d="M 335,190 L 335,1065" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="124" font-size="18" text-anchor="middle" font-weight="400">users:</text><text x="565" y="147" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 565,190 L 565,1065" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="124" font-size="18" text-anchor="middle" font-weight="400">rbac:</text><text x="795" y="147" font-size="17" text-anchor="middle" font-weight="400">RbacReader</text><path d="M 795,190 L 795,1065" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="330" y="260" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,260 L 335,260" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="83.9" y="225" width="272.2" height="26" fill="white"/><text x="220.0" y="245" font-size="20" text-anchor="middle" font-weight="400">1: identity = current()</text><path d="M 335,315 L 105,315" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="89.5" y="280" width="261.0" height="26" fill="white"/><text x="220.0" y="300" font-size="20" text-anchor="middle" font-weight="400">2: identity；缺失则 401</text><rect x="560" y="420" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,420 L 565,420" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="176.10000000000002" y="385" width="317.79999999999995" height="26" fill="white"/><text x="335.0" y="405" font-size="20" text-anchor="middle" font-weight="400">3: requireCurrent(identity)</text><path d="M 565,480 L 105,480" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="200.1" y="445" width="269.8" height="26" fill="white"/><text x="335.0" y="465" font-size="20" text-anchor="middle" font-weight="400">4: 当前用户；已删除则 401</text><rect x="790" y="585" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,585 L 795,585" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="302.5" y="550" width="294.99999999999994" height="26" fill="white"/><text x="450.0" y="570" font-size="20" text-anchor="middle" font-weight="400">5: requireLogin(identity)</text><rect x="35" y="675" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="704" font-size="20" text-anchor="start" font-weight="400">写请求在进入 Controller 前校验 CSRF；失败返回 403。管理 API 要求目标系统为</text><text x="50" y="729" font-size="20" text-anchor="start" font-weight="400">rbac。</text><rect x="790" y="840" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,840 L 795,840" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="262.6" y="805" width="374.79999999999995" height="26" fill="white"/><text x="450.0" y="825" font-size="20" text-anchor="middle" font-weight="400">6: requireOperation(actor, code)</text><path d="M 795,915 L 105,915" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="315.1" y="880" width="269.8" height="26" fill="white"/><text x="450.0" y="900" font-size="20" text-anchor="middle" font-weight="400">7: 通过；无操作权限则 403</text><rect x="35" y="965" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="994" font-size="20" text-anchor="start" font-weight="400">通过后进入具体用例；服务在事务内复核操作权限和资源范围。当前鉴权只检查</text><text x="50" y="1019" font-size="20" text-anchor="start" font-weight="400">login，随后返回 allowed。</text></svg>