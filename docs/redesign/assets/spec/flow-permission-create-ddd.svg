rmission(data)</text><rect x="35" y="715" width="830" height="100" fill="none" stroke="black"/><path d="M 35,745 L 82.0,745.0 Q 98,745 103.0,740.0 L 108.0,735.0 Q 113,730 113.0,725.0 L 113,715" fill="none" stroke="black" stroke-width="1.4"/><text x="47" y="737" font-size="17" text-anchor="start" font-weight="600">break</text><rect x="125" y="723" width="97.38" height="23" fill="white"/><text x="130" y="740" font-size="17" text-anchor="start" font-weight="400">[校验失败]</text><path d="M 335,795 L 105,795" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="60.80000000000001" y="760" width="318.4" height="26" fill="white"/><text x="220.0" y="780" font-size="20" text-anchor="middle" font-weight="400">5: 抛出业务异常；4xx，事务回滚</text><rect x="560" y="940" width="10" height="60" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,940 L 565,940" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="342.4" y="905" width="215.2" height="26" fill="white"/><text x="450.0" y="925" font-size="20" text-anchor="middle" font-weight="400">6: insert(newData)</text><path d="M 335,1100 L 105,1100" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="107.9" y="1065" width="224.2" height="26" fill="white"/><text x="220.0" y="1085" font-size="20" text-anchor="middle" font-weight="400">7: 事务提交后返回结果</text><rect x="35" y="1150" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1179" font-size="20" text-anchor="start" font-weight="400">事务覆盖加载至提交。路径系统存在；code 在系统内唯一。</text></svg>