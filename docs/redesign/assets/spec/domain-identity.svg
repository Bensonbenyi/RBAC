<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1470" viewBox="0 0 900 1470"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">DDD 领域对象 用户 角色 部门</text><rect x="25" y="100" width="400" height="452" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="225.0" y="132" font-size="19" text-anchor="middle" font-weight="600">User</text><path d="M 25,144 L 425,144" fill="none" stroke="black" stroke-width="1.4"/><text x="35" y="170" font-size="20" text-anchor="start" font-weight="400">- id: Long</text><text x="35" y="206" font-size="20" text-anchor="start" font-weight="400">- departmentId: Long</text><text x="35" y="242" font-size="20" text-anchor="start" font-weight="400">- roleIds: Set&lt;Long&gt;</text><text x="35" y="278" font-size="20" text-anchor="start" font-weight="400">- username: String</text><text x="35" y="314" font-size="20" text-anchor="start" font-weight="400">- name: String</text><text x="35" y="350" font-size="20" text-anchor="start" font-weight="400">- phone: String</text><path d="M 25,360 L 425,360" fill="none" stroke="black" stroke-width="1.4"/><text x="35" y="386" font-size="20" text-anchor="start" font-weight="400">+ assignRole(role: Role,</text><text x="35" y="414" font-size="20" text-anchor="start" font-weig