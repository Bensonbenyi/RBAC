<text x="180" y="995" font-size="20" text-anchor="start" font-weight="400">- id: Long</text><text x="180" y="1031" font-size="20" text-anchor="start" font-weight="400">- name: String</text><text x="180" y="1067" font-size="20" text-anchor="start" font-weight="400">- parentId: Long</text><path d="M 170,1077 L 730,1077" fill="none" stroke="black" stroke-width="1.4"/><text x="180" y="1103" font-size="20" text-anchor="start" font-weight="400">+ change(cmd:  UpdateCommand): void</text><text x="180" y="1139" font-size="20" text-anchor="start" font-weight="400">+ requireDeletable(references:  ReferenceData):</text><text x="180" y="1167" font-size="20" text-anchor="start" font-weight="400">void</text><path d="M 425,350 L 475,350" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="450" y="75" font-size="19" text-anchor="middle" font-weight="400">按 roleIds 引用</text><path d="M 225,552 L 225,925" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 675,452 L 675,925" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="35" y="1300" width="830" height="111" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="1329" font-size="20" text-anchor="start" font-weight="400">虚线依赖表示按编号引用其他聚合，持久化仍使用原七张表。</text><text x="50" y="1358" font-size="20" text-anchor="start" font-weight="400">User 维护角色编号集合；Role 维护权限编号集合。</text><text x="50" y="1387" font-size="20" text-anchor="start" font-weight="400">本图 departmentId 和 roleIds 对应既有业务约束。</text></svg>