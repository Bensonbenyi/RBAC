<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">登录成功 建立会话顺序图</text><rect x="25" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="124" font-size="18" text-anchor="middle" font-weight="400">api:</text><text x="120" y="147" font-size="17" text-anchor="middle" font-weight="400">AuthController</text><path d="M 120,190 L 120,815" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="124" font-size="18" text-anchor="middle" font-weight="400">request:</text><text x="450" y="147" font-size="17" text-anchor="middle" font-weight="400">HttpServletRequest</text><path d="M 450,190 L 450,815" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="124" font-size="18" text-anchor="middle" font-weight="400">session:</text><text x="780" y="147" font-size="17" text-anchor="middle" font-weight="400">HttpSession</text><path d="M 780,190 L 780,815" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="260" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,260 L 450,260" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="137.50000000000003" y="225" width="294.99999999999994" height="26" fill="white"/><text x="285.0" y="245" font-size="20" text-anchor="middle" font-weight="400">1: session = getSession()</text><path d="M 450,320 L 120,320" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="223.0" y="285" width="123.99999999999999" height="26" fill="white"/><text x="285.0" y="305" font-size="20" text-anchor="middle" font-weight="400">2: session</text><rect x="445" y="435" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,435 L 450,435" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="166.0" y="400" width="237.99999999999997" height="26" fill="white"/><text x="285.0" y="420" font-size="20" text-anchor="middle" font-weight="400">3: changeSessionId()</text><rect x="775" y="600" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,600 L 780,600" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="245.50000000000003" y="565" width="408.99999999999994" height="26" fill="white"/><text x="450.0" y="585" font-size="20" text-anchor="middle" font-weight="400">4: setAttribute(&quot;identity&quot;, result)</text><rect x="35" y="715" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="744" font-size="20" text-anchor="start" font-weight="400">Session 业务身份仅含 userId、systemKey；返回 200 与 Cookie。框架维护</text><text x="50" y="769" font-size="20" text-anchor="start" font-weight="400">CSRF，客户端再次取得凭据。</text></svg>