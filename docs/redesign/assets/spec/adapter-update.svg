<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1035" viewBox="0 0 900 1035"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">JPA 用户适配器 更新顺序图</text><rect x="25" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="122" font-size="20" text-anchor="middle" font-weight="400">adapter:</text><text x="120" y="154" font-size="20" text-anchor="middle" font-weight="400">JpaUserStore</text><path d="M 120,225 L 120,1000" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="122" font-size="20" text-anchor="middle" font-weight="400">repo:</text><text x="450" y="154" font-size="20" text-anchor="middle" font-weight="400">UserJpa</text><text x="450" y="182" font-size="20" text-anchor="middle" font-weight="400">Repository</text><path d="M 450,225 L 450,1000" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="122" font-size="20" text-anchor="middle" font-weight="400">factory:</text><text x="780" y="154" font-size="20" text-anchor="middle" font-weight="400">CloneFactory</text><path d="M 780,225 L 780,1000" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="305" width="10" height="50" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,305 L 450,305" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="103.30000000000001" y="270" width="363.4" height="26" fill="white"/><text x="285.0" y="290" font-size="20" text-anchor="middle" font-weight="400">1: existing = findById(data.id)</text><path d="M 450,380 L 120,380" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="145.9" y="345" width="278.2" height="26" fill="white"/><text x="285.0" y="365" font-size="20" text-anchor="middle" font-weight="400">2: UserPO；不存在抛出 404</text><rect x="775" y="505" width="10" height="60" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,505 L 780,505" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="296.8" y="470" width="306.4" height="26" fill="white"/><text x="450.0" y="490" font-size="20" text-anchor="middle" font-weight="400">3: po = copy(target, data)</text><path d="M 780,595 L 120,595" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="337.9" y="560" width="224.2" height="26" fill="white"/><text x="450.0" y="580" font-size="20" text-anchor="middle" font-weight="400">4: 仅拷贝允许变更字段</text><rect x="445" y="715" width="10" height="65" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,715 L 450,715" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="171.70000000000002" y="680" width="226.59999999999997" height="26" fill="white"/><text x="285.0" y="700" font-size="20" text-anchor="middle" font-weight="400">5: saved = save(po)</text><path d="M 450,810 L 120,810" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="134.4" y="775" width="301.2" height="26" fill="white"/><text x="285.0" y="795" font-size="20" text-anchor="middle" font-weight="400">6: saved；返回编号或完成更新</text><rect x="35" y="880" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="909" font-size="20" text-anchor="start" font-weight="400">调用参与外层服务事务；提交时唯一约束冲突映射 409，整体回滚。更新只拷贝</text><text x="50" y="934" font-size="20" text-anchor="start" font-weight="400">name、phone，固定字段由映射排除。</text></svg>