<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1480" viewBox="0 0 1060 1480"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="530.0" y="38" font-size="26" text-anchor="middle" font-weight="600">分配角色活动图</text><text x="530.0" y="72" font-size="16" text-anchor="middle" font-weight="400">两套实现采用同一业务规则</text><circle cx="300" cy="115" r="10" fill="black"/><rect x="80.0" y="157.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="194" font-size="18" text-anchor="middle" font-weight="400">读取已登录操作者</text><text x="300" y="218" font-size="18" text-anchor="middle" font-weight="400">校验目标 userId 与 roleId</text><path d="M190.0,335 L300,290.0 L410.0,335 L300,380.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="341" font-size="17" text-anchor="middle" font-weight="400">有分配权限？</text><rect x="80.0" y="427.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="476" font-size="18" text-anchor="middle" font-weight="400">读取操作者、目标用户与角色</text><path d="M190.0,605 L300,560.0 L410.0,605 L300,650.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="611" font-size="17" text-anchor="middle" font-weight="400">记录均存在？</text><path d="M190.0,740 L300,695.0 L410.0,740 L300,785.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="746" font-size="17" text-anchor="middle" font-weight="400">同一非空部门？</text><path d="M190.0,875 L300,830.0 L410.0,875 L300,920.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="881" font-size="17" text-anchor="middle" font-weight="400">尚未分配？</text><rect x="80.0" y="967.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="1004" font-size="18" text-anchor="middle" font-weight="400">在事务内写入 user_role</text><text x="300" y="1028" font-size="18" text-anchor="middle" font-weight="400">由选中的服务实现完成</text><rect x="80.0" y="1112.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="1161" font-size="18" text-anchor="middle" font-weight="400">事务提交后返回成功</text><circle cx="300" cy="1280" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="300" cy="1280" r="10" fill="black"/><path d="M 300,130.0 L 300,152.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,247.5 L 300,285.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,385.0 L 300,422.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="403.75" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,517.5 L 300,555.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,655.0 L 300,690.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="672.5" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,790.0 L 300,825.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="807.5" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,925.0 L 300,962.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="943.75" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,1057.5 L 300,1107.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,1202.5 L 300,1260.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="302.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="341" font-size="18" text-anchor="middle" font-weight="400">403：无 user.role.assign</text><circle cx="995" cy="335" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="335" r="10" fill="black"/><path d="M 415.0,335 L 645.0,335" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="322" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,335 L 975.0,335" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="572.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="611" font-size="18" text-anchor="middle" font-weight="400">404：用户或角色不存在</text><circle cx="995" cy="605" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="605" r="10" fill="black"/><path d="M 415.0,605 L 645.0,605" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="592" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,605 L 975.0,605" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="707.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="746" font-size="18" text-anchor="middle" font-weight="400">403：超出部门范围</text><circle cx="995" cy="740" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="740" r="10" fill="black"/><path d="M 415.0,740 L 645.0,740" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="727" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,740 L 975.0,740" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="842.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="881" font-size="18" text-anchor="middle" font-weight="400">409：角色已分配</text><circle cx="995" cy="875" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="875" r="10" fill="black"/><path d="M 415.0,875 L 645.0,875" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="862" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,875 L 975.0,875" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="80" y="1350" width="900" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="95" y="1377" font-size="17" text-anchor="start" font-weight="400">操作者 ID 取自 Session，不接受前端伪造；本图前提是已登录且通过请求格式校验。</text><text x="95" y="1402" font-size="17" text-anchor="start" font-weight="400">权限、记录、部门、重复校验和写入在同一事务内；数据库保留联合主键防止重复。</text></svg>