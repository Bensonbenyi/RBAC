97" height="23" fill="white"/><text x="960.0" y="397" font-size="17" text-anchor="middle" font-weight="400">3: user = findByUsername(cmd.username)</text><rect x="1109" y="410" width="12" height="50" fill="white" stroke="black"/><rect x="489" y="1130" width="12" height="30" fill="white" stroke="black"/><rect x="2039" y="1030" width="12" height="30" fill="white" stroke="black"/><rect x="1729" y="950" width="12" height="30" fill="white" stroke="black"/><rect x="1729" y="870" width="12" height="30" fill="white" stroke="black"/><rect x="1419" y="640" width="12" height="50" fill="white" stroke="black"/><path d="M 1115,460 L 805,460" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="921.085" y="430" width="77.83" height="23" fill="white"/><text x="960.0" y="447" font-size="17" text-anchor="middle" font-weight="400">4: user</text><rect x="820" y="500" width="570" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="835" y="527" font-size="17" text-anchor="start" font-weight="400">凭据匹配由选中的登录服务执行。</text><text x="835" y="552" font-size="17" text-anchor="start" font-weight="400">账号或凭据错误：抛出 UnauthorizedException。</text><path d="M 805,640 L 1425,640" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="824.145" y="610" width="581.7099999999999" height="23" fill="white"/><text x="1115.0" y="627" font-size="17" text-anchor="middle" font-weight="400">5: allowed = hasPermission(user.id, cmd.systemKey, &quot;login&quot;)</text><path d="M 1425,690 L 805,690" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="1061.55" y="660" width="106.89999999999999" height="23" fill="white"/><text x="1115.0" y="677" font-size="17" text-anchor="middle" font-weight="400">6: allowed</text><rect x="1020" y="725" width="730" height="74" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="1035" y="752" font-size="17" text-anchor="start" font-weight="400">allowed 为 false 时抛出 ForbiddenException。</text><text x="1035" y="777" font-size="17" text-anchor="start" font-weight="400">失败交互及 HTTP 映射见登录活动图和接口表。</text><path d="M 805,790 L 185,790" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="446.395" y="760" width="97.21" height="23" fill="white"/><text x="495.0" y="777" font-size="17" text-anchor="middle" font-weight="400">7: result</text><path d="M 185,870 L 1735,870" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="833.875" y="840" width="252.25" height="23" fill="white"/><text x="960.0" y="857" font-size="17" text-anchor="middle" font-weight="400">8: session = getSession()</text><path d="M 185,950 L 1735,950" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="858.1" y="920" width="203.79999999999998" height="23" fill="white"/><text x="960.0" y="937" font-size="17" text-anchor="middle" font-weight="400">9: changeSessionId()</text><path d="M 185,1030 L 2045,1030" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="935.58" y="1000" width="358.84" height="23" fill="white"/><text x="1115.0" y="1017" font-size="17" text-anchor="middle" font-weight="400">10: setAttribute(&quot;identity&quot;, result)</text><path d="M 185,1130 L 495,1130" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="189.65" y="1100" width="300.7" height="23" fill="white"/><text x="340.0" y="1117" font-size="17" text-anchor="middle" font-weight="400">11: vo = copy(loginVO, result)</text></svg>