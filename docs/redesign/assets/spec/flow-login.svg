<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">账号与登录资格 顺序图</text><rect x="10" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="105" y="124" font-size="18" text-anchor="middle" font-weight="400">api:</text><text x="105" y="147" font-size="17" text-anchor="middle" font-weight="400">AuthController</text><path d="M 105,190 L 105,995" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="240" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="335" y="124" font-size="18" text-anchor="middle" font-weight="400">service:</text><text x="335" y="147" font-size="17" text-anchor="middle" font-weight="400">AuthUseCase</text><path d="M 335,190 L 335,995" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="470" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="565" y="124" font-size="18" text-anchor="middle" font-weight="400">users:</text><text x="565" y="147" font-size="17" text-anchor="middle" font-weight="400">UserStore</text><path d="M 565,190 L 565,995" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="700" y="100" width="190" height="90" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="795" y="124" font-size="18" text-anchor="middle" font-weight="400">rbac:</text><text x="795" y="147" font-size="17" text-anchor="middle" font-weight="400">RbacReader</text><path d="M 795,190 L 795,995" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="330" y="260" width="10" height="610" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 105,260 L 335,260" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="140.9" y="225" width="158.2" height="26" fill="white"/><text x="220.0" y="245" font-size="20" text-anchor="middle" font-weight="400">1: login(cmd)</text><rect x="560" y="375" width="10" height="40" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,375 L 565,375" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="279.70000000000005" y="310" width="340.59999999999997" height="26" fill="white"/><text x="450.0" y="330" font-size="20" text-anchor="middle" font-weight="400">2: user = findByUsername(cmd.</text><rect x="393.7" y="340" width="112.6" height="26" fill="white"/><text x="450.0" y="360" font-size="20" text-anchor="middle" font-weight="400">username)</text><path d="M 565,435 L 335,435" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="369.4" y="400" width="161.2" height="26" fill="white"/><text x="450.0" y="420" font-size="20" text-anchor="middle" font-weight="400">3: user 或空值</text><rect x="35" y="485" width="830" height="53" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="514" font-size="20" text-anchor="start" font-weight="400">服务比较 password 与 phone；账号不存在或不匹配时清理旧身份并返回统一 401。</text><rect x="790" y="665" width="10" height="45" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 335,665 L 795,665" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="309.20000000000005" y="630" width="511.5999999999999" height="26" fill="white"/><text x="565.0" y="650" font-size="20" text-anchor="middle" font-weight="400">4: hasPermission(userId, systemKey, &quot;login&quot;)</text><path d="M 795,740 L 335,740" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="426.0" y="705" width="278.0" height="26" fill="white"/><text x="565.0" y="725" font-size="20" text-anchor="middle" font-weight="400">5: allowed；false 则 403</text><path d="M 335,870 L 105,870" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="45.20000000000002" y="835" width="349.59999999999997" height="26" fill="white"/><text x="220.0" y="855" font-size="20" text-anchor="middle" font-weight="400">6: LoginResult；进入会话建立流程</text><rect x="35" y="920" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="949" font-size="20" text-anchor="start" font-weight="400">输入由 Controller 校验并经 CloneFactory 转为</text><text x="50" y="974" font-size="20" text-anchor="start" font-weight="400">Command。登录失败清理旧身份，重取 CSRF。</text></svg>