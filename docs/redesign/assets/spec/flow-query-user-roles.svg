<svg xmlns="http://www.w3.org/2000/svg" width="900" height="865" viewBox="0 0 900 865"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="38" font-size="26" text-anchor="middle" font-weight="600">用户已分配角色查询 顺序图</text><rect x="25" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="120" y="122" font-size="20" text-anchor="middle" font-weight="400">api:</text><text x="120" y="154" font-size="20" text-anchor="middle" font-weight="400">UserRole</text><text x="120" y="182" font-size="20" text-anchor="middle" font-weight="400">Controller</text><path d="M 120,225 L 120,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="355" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="450" y="122" font-size="20" text-anchor="middle" font-weight="400">service:</text><text x="450" y="154" font-size="20" text-anchor="middle" font-weight="400">UserUseCase</text><path d="M 450,225 L 450,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="685" y="100" width="190" height="125" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="780" y="122" font-size="20" text-anchor="middle" font-weight="400">store:</text><text x="780" y="154" font-size="20" text-anchor="middle" font-weight="400">UserStore</text><path d="M 780,225 L 780,830" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="445" y="300" width="10" height="410" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 120,300 L 450,300" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="160.3" y="265" width="249.39999999999998" height="26" fill="white"/><text x="285.0" y="285" font-size="20" text-anchor="middle" font-weight="400">1: roles(actorId, id)</text><rect x="775" y="435" width="10" height="130" rx="0" fill="white" stroke="black" stroke-width="1.4"/><path d="M 450,435 L 780,435" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#filled)"/><rect x="421.90000000000003" y="400" width="386.19999999999993" height="26" fill="white"/><text x="615.0" y="420" font-size="20" text-anchor="middle" font-weight="400">2: result = query(actorId, query)</text><path d="M 780,585 L 450,585" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="492.9" y="550" width="244.2" height="26" fill="white"/><text x="615.0" y="570" font-size="20" text-anchor="middle" font-weight="400">3: 按范围过滤的查询数据</text><path d="M 450,710 L 120,710" fill="none" stroke="black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="96.0" y="675" width="378.0" height="26" fill="white"/><text x="285.0" y="695" font-size="20" text-anchor="middle" font-weight="400">4: Result；API 拷贝为 VO，返回 200</text><rect x="35" y="750" width="830" height="78" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="50" y="779" font-size="20" text-anchor="start" font-weight="400">先校验用户存在与同部门，再读取角色。端口绑定启动配置选中的实现；失败按统一异常映</text><text x="50" y="804" font-size="20" text-anchor="start" font-weight="400">射返回。</text></svg>