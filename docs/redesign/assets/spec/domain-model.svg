"black" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="48.135000000000005" y="419" width="243.73" height="27" fill="white"/><text x="170" y="440" font-size="21" text-anchor="middle" font-weight="400">parentId 引用上级部门</text><rect x="610" y="1170" width="470" height="198" rx="0" fill="white" stroke="black" stroke-width="1.4"/><text x="625" y="1199" font-size="20" text-anchor="start" font-weight="400">按编号引用其他聚合。</text><text x="625" y="1228" font-size="20" text-anchor="start" font-weight="400">User.roleIds 表达用户角色集合。</text><text x="625" y="1257" font-size="20" text-anchor="start" font-weight="400">Role.permissionIds 表达角色权限集合。</text><text x="625" y="1286" font-size="20" text-anchor="start" font-weight="400">部门角色归属限定授权范围。</text><text x="625" y="1315" font-size="20" text-anchor="start" font-weight="400">各对象保存业务属性与领域行为。</text><text x="625" y="1344" font-size="20" text-anchor="start" font-weight="400">关联持久化仍用原有两张中间表。</text></svg>