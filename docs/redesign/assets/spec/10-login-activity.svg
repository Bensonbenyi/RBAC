<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1360" viewBox="0 0 1060 1360"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:black}</style><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="black"/></marker><marker id="filled" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11 Z" fill="black"/></marker><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L14,8 L1,15 Z" fill="white" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="530.0" y="38" font-size="26" text-anchor="middle" font-weight="600">登录活动图</text><text x="530.0" y="72" font-size="16" text-anchor="middle" font-weight="400">两套实现采用同一业务规则</text><circle cx="300" cy="115" r="10" fill="black"/><rect x="80.0" y="167.5" width="440" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="206" font-size="18" text-anchor="middle" font-weight="400">接收用户名、password、单个目标系统</text><path d="M190.0,315 L300,270.0 L410.0,315 L300,360.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="321" font-size="17" text-anchor="middle" font-weight="400">参数有效？</text><rect x="80.0" y="407.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="456" font-size="18" text-anchor="middle" font-weight="400">按用户名读取用户</text><path d="M190.0,585 L300,540.0 L410.0,585 L300,630.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="591" font-size="17" text-anchor="middle" font-weight="400">手机号匹配？</text><rect x="80.0" y="677.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="714" font-size="18" text-anchor="middle" font-weight="400">按用户—角色—权限查询</text><text x="300" y="738" font-size="18" text-anchor="middle" font-weight="400">目标系统的 login 权限</text><path d="M190.0,855 L300,810.0 L410.0,855 L300,900.0 Z" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="861" font-size="17" text-anchor="middle" font-weight="400">拥有登录权限？</text><rect x="80.0" y="952.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="989" font-size="18" text-anchor="middle" font-weight="400">更新 Session 标识并保存身份</text><text x="300" y="1013" font-size="18" text-anchor="middle" font-weight="400">Session 只保存 userId、systemKey</text><rect x="80.0" y="1097.5" width="440" height="85" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="300" y="1146" font-size="18" text-anchor="middle" font-weight="400">返回结果并设置会话 Cookie</text><circle cx="300" cy="1270" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="300" cy="1270" r="10" fill="black"/><path d="M 300,130.0 L 300,162.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,237.5 L 300,265.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,365.0 L 300,402.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="383.75" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,497.5 L 300,535.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,635.0 L 300,672.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="653.75" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,767.5 L 300,805.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,905.0 L 300,947.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="335" y="926.25" font-size="17" text-anchor="start" font-weight="400">[是]</text><path d="M 300,1042.5 L 300,1092.5" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><path d="M 300,1187.5 L 300,1250.0" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="282.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="321" font-size="18" text-anchor="middle" font-weight="400">返回 400：参数错误</text><circle cx="995" cy="315" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="315" r="10" fill="black"/><path d="M 415.0,315 L 645.0,315" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="302" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,315 L 975.0,315" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="552.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="591" font-size="18" text-anchor="middle" font-weight="400">返回 401：账号或凭据错误</text><circle cx="995" cy="585" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="585" r="10" fill="black"/><path d="M 415.0,585 L 645.0,585" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="572" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,585 L 975.0,585" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><rect x="650.0" y="822.5" width="280" height="65" rx="14" fill="white" stroke="black" stroke-width="1.4"/><text x="790" y="861" font-size="18" text-anchor="middle" font-weight="400">返回 403：无系统登录权限</text><circle cx="995" cy="855" r="15" fill="white" stroke="black" stroke-width="1.4"/><circle cx="995" cy="855" r="10" fill="black"/><path d="M 415.0,855 L 645.0,855" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530.0" y="842" font-size="17" text-anchor="middle" font-weight="400">[否]</text><path d="M 935.0,855 L 975.0,855" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#open)"/><text x="530" y="1325" font-size="17" text-anchor="middle" font-weight="400">password 的内容为手机号；日志不记录凭据、完整手机号或 Session ID。</text></svg>