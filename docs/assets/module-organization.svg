<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" role="img" aria-labelledby="title desc">
  <title id="title">M2 组织与管理范围内部职责</title>
  <desc id="desc">维护用例以管理范围和归属规则维护员工及管理员身份，通过本模块JPA Repository查询保存。员工停用与调动协调在模块外，组织模块不直接调用身份或授权模块。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
  <style>
    text { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; fill:#1e293b; text-anchor:middle; }
    .title { font-size:16px; font-weight:600; } .body { font-size:12px; } .note { font-size:10px; fill:#64748b; }
    .flow { fill:none; stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
  </style>
  <rect width="780" height="390" fill="#fff"/>
  <text class="title" x="390" y="32">M2 组织与管理范围内部职责</text>
  <path class="flow" d="M250,108 L269,108"/>
  <path class="flow" d="M505,108 L524,108"/>
  <path class="flow" d="M390,149 L390,163"/>
  <path class="flow" d="M390,251 L390,265"/>
  <rect x="25" y="72" width="220" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="135" y="99">组织、员工与管理员维护</text>
  <text class="note" x="135" y="117">可信操作者及目标对象</text>
  <rect x="280" y="72" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="99">维护用例</text>
  <text class="note" x="390" y="117">校验范围后查询或保存</text>
  <rect x="535" y="72" width="220" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="645" y="99">M6 同步审计</text>
  <text class="note" x="645" y="117">资料、身份及归属变更</text>
  <rect x="280" y="174" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="198">组织身份维护处理</text>
  <text class="note" x="390" y="216">使用管理范围与归属规则</text>
  <text class="note" x="390" y="234">员工、所属部门及管理员身份</text>
  <rect x="25" y="174" width="220" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="body" x="135" y="198">公司直属员工</text>
  <text class="note" x="135" y="216">最高管理员维护待确认归属</text>
  <text class="note" x="135" y="234">明确部门后再配置部门授权</text>
  <rect x="535" y="174" width="220" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="body" x="645" y="198">模块外应用协调者</text>
  <text class="note" x="645" y="216">协调员工停用及跨部门调动</text>
  <text class="note" x="645" y="234">本模块不直接调用 M1／M5</text>
  <rect x="280" y="276" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="390" y="299">本模块 JPA Repository</text>
  <text class="note" x="390" y="317">查询和保存组织身份状态</text>
  <text class="note" x="390" y="365">箭头：概念运行调用与状态访问。职责框不规定源码依赖或具体类。</text>
</svg>
