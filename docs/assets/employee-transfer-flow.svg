<svg viewBox="0 0 700 520" width="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">员工跨部门手工调动</title>
  <desc id="desc">原部门先撤销员工全部系统角色。确认无剩余角色且撤权已生效后，最高管理员调整部门并取消原部门管理员身份，新部门重新授权。条件未满足则禁止调动，不自动继承权限。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; }
    .title { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .step { font-size: 12px; text-anchor: middle; }
    .note { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.1; marker-end: url(#arrow); }
    .failure { fill: none; stroke: #ef4444; stroke-width: 1.1; marker-end: url(#arrow-red); }
  </style>
  <rect width="700" height="520" fill="#ffffff"/>
  <text class="title" x="350" y="32">员工跨部门手工调动</text>

  <!-- Main column: x=30, width=320, center=190; gap=30. -->
  <path class="flow" d="M190,115 L190,129"/>
  <path class="flow" d="M190,199 L190,213"/>
  <path class="flow" d="M190,301 L190,315"/>
  <path class="flow" d="M190,385 L190,399"/>
  <path class="failure" d="M355,167 L369,167"/>

  <rect x="30" y="56" width="320" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="190" y="79">原部门管理员撤销员工全部系统角色</text>
  <text class="note" x="190" y="97">覆盖原部门下的所有系统授权</text>

  <rect x="30" y="140" width="320" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="190" y="163">核对无剩余角色</text>
  <text class="note" x="190" y="181">且有效权限撤销已生效</text>

  <rect x="30" y="224" width="320" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="190" y="246">最高管理员调整所属部门</text>
  <text class="note" x="190" y="264">取消原部门管理员身份（若有）</text>
  <text class="note" x="190" y="282">保存后不继承旧角色</text>

  <rect x="30" y="326" width="320" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="190" y="349">新部门管理员重新授权</text>
  <text class="note" x="190" y="367">仅选择本部门可用系统的角色</text>

  <rect x="30" y="410" width="320" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="190" y="433">后续鉴权取得新有效权限</text>
  <text class="note" x="190" y="451">授权提交后最多 3 秒生效</text>

  <rect x="380" y="140" width="290" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="525" y="163">条件未满足，禁止调动</text>
  <text class="note" x="525" y="181">保留原部门，先完成撤权</text>

  <text class="note" x="158" y="211">通过</text>
  <text class="note" x="365" y="150">失败</text>
  <text class="note" x="350" y="495">所有步骤留痕；调动期间由管理员手工处理，不自动继承权限。</text>
</svg>
