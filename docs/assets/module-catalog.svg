<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 408" width="780" role="img" aria-labelledby="title desc">
  <title id="title">M4 权限目录与角色内部职责</title>
  <desc id="desc">目录与角色用例整体校验确认权限目录，维护模板与独立部门角色，并排除停用权限。状态由本模块保存，不反向调用授权鉴权模块。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
  <style>
    text { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; fill:#1e293b; text-anchor:middle; }
    .title { font-size:16px; font-weight:600; } .body { font-size:12px; } .note { font-size:10px; fill:#64748b; }
    .flow { fill:none; stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
  </style>
  <rect width="780" height="408" fill="#fff"/>
  <text class="title" x="390" y="32">M4 权限目录与角色内部职责</text>
  <path class="flow" d="M250,108 L269,108"/>
  <path class="flow" d="M505,108 L524,108"/>
  <path class="flow" d="M305,149 C305,160 135,152 135,163"/>
  <path class="flow" d="M390,149 L390,163"/>
  <path class="flow" d="M475,149 C475,160 645,152 645,163"/>
  <path class="flow" d="M135,251 C135,262 305,254 305,265"/>
  <path class="flow" d="M390,251 L390,265"/>
  <path class="flow" d="M645,251 C645,262 475,254 475,265"/>
  <rect x="25" y="72" width="220" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="135" y="99">目录上报及角色配置</text>
  <text class="note" x="135" y="117">来源与管理范围需可信</text>
  <rect x="280" y="72" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="99">目录与角色用例</text>
  <text class="note" x="390" y="117">使用 M2 范围、M3 接入事实</text>
  <rect x="535" y="72" width="220" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="645" y="99">M6 同步审计</text>
  <text class="note" x="645" y="117">确认、拒绝及角色变更</text>
  <rect x="25" y="174" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="135" y="198">目录校验与整体确认</text>
  <text class="note" x="135" y="216">归属、完整性、重复及顺序</text>
  <text class="note" x="135" y="234">失败保留已确认目录</text>
  <rect x="280" y="174" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="198">模板与部门角色维护</text>
  <text class="note" x="390" y="216">复制后由部门独立维护</text>
  <text class="note" x="390" y="234">新增权限不自动授予</text>
  <rect x="535" y="174" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="645" y="198">权限停用处理</text>
  <text class="note" x="645" y="216">按规则从有效角色排除停用项</text>
  <text class="note" x="645" y="234">重新启用须显式配置</text>
  <rect x="280" y="276" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="390" y="299">目录与角色存储</text>
  <text class="note" x="390" y="317">本模块 JPA Repository</text>
  <text class="note" x="390" y="365">M4 提供当前事实；不反向调用 M5，也不推送员工角色副本。</text>
  <text class="note" x="390" y="383">箭头：概念运行调用与状态访问。职责框不规定源码依赖或具体类。</text>
</svg>
