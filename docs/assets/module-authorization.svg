<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 408" width="820" role="img" aria-labelledby="title desc">
  <title id="title">M5 授权与鉴权内部职责</title>
  <desc id="desc">应用用例维护单角色分配并查询会话、组织、接入和目录事实。有效权限纯规则无输入输出访问，供管理查询与运行鉴权共用。角色分配由本模块保存，缓存有界且不得延长陈旧时间。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
  <style>
    text { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; fill:#1e293b; text-anchor:middle; }
    .title { font-size:16px; font-weight:600; } .body { font-size:12px; } .note { font-size:10px; fill:#64748b; }
    .flow { fill:none; stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
  </style>
  <rect width="820" height="408" fill="#fff"/>
  <text class="title" x="410" y="32">M5 授权与鉴权内部职责</text>
  <!-- Columns: x=25/290/560, width=235/240/235, gap=30. -->
  <path class="flow" d="M265,108 L279,108"/>
  <path class="flow" d="M535,108 L549,108"/>
  <path class="flow" d="M315,149 C315,160 142,152 142,163"/>
  <path class="flow" d="M410,149 L410,163"/>
  <path class="flow" d="M535,210 L549,210"/>
  <path class="flow" d="M142,251 L142,265"/>
  <path class="flow" d="M410,251 L410,265"/>
  <path class="flow" d="M535,303 L549,303"/>
  <rect x="25" y="72" width="235" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="142" y="99">管理员／外部系统</text>
  <text class="note" x="142" y="117">管理或鉴权请求的可信上下文</text>
  <rect x="290" y="72" width="240" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="410" y="96">写与读应用用例</text>
  <text class="note" x="410" y="114">单角色分配、换角及撤权</text>
  <text class="note" x="410" y="132">有效权限查询与运行时鉴权</text>
  <rect x="560" y="72" width="235" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="677" y="99">M6 同步审计</text>
  <text class="note" x="677" y="117">管理变更、拒绝及异常</text>
  <rect x="25" y="174" width="235" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="142" y="198">写操作校验</text>
  <text class="note" x="142" y="216">单角色、范围及并发冲突</text>
  <text class="note" x="142" y="234">换角与保存形成短变更边界</text>
  <rect x="290" y="174" width="240" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="410" y="198">事实读取与有界缓存</text>
  <text class="note" x="410" y="216">读取本模块角色分配</text>
  <text class="note" x="410" y="234">整体陈旧最多 3 秒，命中不续期</text>
  <rect x="560" y="174" width="235" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="677" y="198">通过 M1 至 M4 能力查事实</text>
  <text class="note" x="677" y="216">会话、员工、管理范围与接入</text>
  <text class="note" x="677" y="234">部门角色及有效权限目录</text>
  <rect x="25" y="276" width="235" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="142" y="299">本模块分配保存</text>
  <text class="note" x="142" y="317">JPA Repository</text>
  <rect x="290" y="276" width="240" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="body" x="410" y="299">纯有效权限规则</text>
  <text class="note" x="410" y="317">无输入输出访问，查询与鉴权共用</text>
  <rect x="560" y="276" width="235" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="677" y="299">查询结果／允许或拒绝</text>
  <text class="note" x="677" y="317">附有效状态或原因类别</text>
  <text class="note" x="410" y="365">状态读取由用例完成；纯规则只计算已取得的业务事实。</text>
  <text class="note" x="410" y="383">箭头：概念运行调用与状态访问。职责框不规定源码依赖或具体类。</text>
</svg>
