<svg viewBox="0 0 800 650" width="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; letter-spacing: 0; }
    .title { font-size: 16px; font-weight: 600; }
    .lane { font-size: 11px; font-weight: 600; text-anchor: middle; }
    .step { font-size: 10px; text-anchor: middle; }
    .note { font-size: 9px; fill: #64748b; text-anchor: middle; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.1; marker-end: url(#arrow); }
  </style>
  <rect width="800" height="650" fill="#ffffff"/>
  <text class="title" x="400" y="30" text-anchor="middle">角色配置、开户授权和撤权流程</text>

  <!-- Swimlane backgrounds -->
  <rect x="20" y="55" width="170" height="570" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="190" y="55" width="230" height="570" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="420" y="55" width="200" height="570" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="620" y="55" width="160" height="570" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="20" y="55" width="760" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <line x1="190" y1="55" x2="190" y2="625" stroke="#94a3b8"/>
  <line x1="420" y1="55" x2="420" y2="625" stroke="#94a3b8"/>
  <line x1="620" y1="55" x2="620" y2="625" stroke="#94a3b8"/>
  <text class="lane" x="105" y="78">管理员</text>
  <text class="lane" x="305" y="78">统一权限管理系统</text>
  <text class="lane" x="520" y="78">外部业务系统</text>
  <text class="lane" x="700" y="78">审计记录</text>

  <!-- Connectors -->
  <path class="flow" d="M179,123 L214,123"/>
  <path class="flow" d="M390,123 C470,123 540,168 618,168"/>
  <path class="flow" d="M305,156 L305,175"/>
  <path class="flow" d="M179,214 L214,214"/>
  <path class="flow" d="M390,214 C425,214 428,257 428,257"/>
  <path class="flow" d="M520,290 L520,309"/>
  <path class="flow" d="M434,348 L396,348"/>
  <path class="flow" d="M220,348 L185,348"/>
  <path class="flow" d="M105,381 L105,410"/>
  <path class="flow" d="M179,449 L214,449"/>
  <path class="flow" d="M390,449 L428,449"/>
  <path class="flow" d="M520,482 L520,501"/>
  <path class="flow" d="M434,540 L396,540"/>
  <path class="flow" d="M390,540 C500,590 570,580 618,561"/>

  <!-- Steps -->
  <rect x="36" y="95" width="138" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="105" y="119">配置角色及权限</text>
  <text class="note" x="105" y="137">选择有效权限项</text>

  <rect x="225" y="95" width="160" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="305" y="119">校验并保存角色</text>
  <text class="note" x="305" y="137">记录角色目标状态</text>

  <rect x="629" y="140" width="142" height="56" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="step" x="700" y="164">记录角色变更</text>
  <text class="note" x="700" y="182">操作者、对象和结果</text>

  <rect x="36" y="186" width="138" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="105" y="210">选择员工和角色</text>
  <text class="note" x="105" y="228">单个或批量</text>

  <rect x="225" y="186" width="160" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="305" y="210">检查范围和当前角色</text>
  <text class="note" x="305" y="228">新角色替换旧角色</text>

  <rect x="439" y="229" width="162" height="56" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="520" y="253">开户或更新角色</text>
  <text class="note" x="520" y="271">返回逐人处理结果</text>

  <rect x="439" y="320" width="162" height="56" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="520" y="344">返回成功或失败</text>
  <text class="note" x="520" y="362">失败不视为已生效</text>

  <rect x="225" y="320" width="160" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="305" y="344">更新同步状态</text>
  <text class="note" x="305" y="362">失败任务进入重试</text>

  <rect x="36" y="320" width="138" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="105" y="344">查看逐人结果</text>
  <text class="note" x="105" y="362">已生效、待同步、失败</text>

  <rect x="36" y="421" width="138" height="56" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="105" y="445">选择员工撤权</text>
  <text class="note" x="105" y="463">确认影响范围</text>

  <rect x="225" y="421" width="160" height="56" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="305" y="445">建立撤权任务</text>
  <text class="note" x="305" y="463">目标为无角色</text>

  <rect x="439" y="421" width="162" height="56" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="520" y="445">移除权限并停用账号</text>
  <text class="note" x="520" y="463">返回处理结果</text>

  <rect x="439" y="512" width="162" height="56" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="520" y="536">确认撤权结果</text>
  <text class="note" x="520" y="554">失败则等待重试</text>

  <rect x="225" y="512" width="160" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="305" y="536">更新最终状态</text>
  <text class="note" x="305" y="554">成功后角色失效</text>

  <rect x="629" y="533" width="142" height="56" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="step" x="700" y="557">记录授权全链路</text>
  <text class="note" x="700" y="575">含每次同步尝试</text>

  <circle cx="105" cy="610" r="8" fill="#1e293b"/>
</svg>
