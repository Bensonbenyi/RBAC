<svg viewBox="0 0 700 400" width="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; letter-spacing: 0; }
    .title { font-size: 16px; font-weight: 600; }
    .actor { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .case { font-size: 11px; text-anchor: middle; }
    .note { font-size: 10px; fill: #64748b; }
    .link { fill: none; stroke: #94a3b8; stroke-width: 1.1; }
  </style>
  <rect width="700" height="400" fill="#ffffff"/>
  <text class="title" x="350" y="30" text-anchor="middle">外部系统用例图</text>
  <rect x="30" y="55" width="480" height="320" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text class="note" x="45" y="74">统一权限管理系统</text>

  <path class="link" d="M540,205 C500,205 485,105 441,105"/>
  <path class="link" d="M540,205 C500,205 485,175 441,175"/>
  <path class="link" d="M540,205 C500,205 485,245 441,245"/>
  <path class="link" d="M540,205 C500,205 485,315 441,315"/>

  <ellipse cx="340" cy="105" rx="101" ry="26" fill="#d1fae5" stroke="#22c55e"/>
  <text class="case" x="340" y="109">上报权限目录</text>
  <ellipse cx="340" cy="175" rx="101" ry="26" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="case" x="340" y="179">接收开户和资料更新</text>
  <ellipse cx="340" cy="245" rx="101" ry="26" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="case" x="340" y="249">接收授权、换角和撤权</text>
  <ellipse cx="340" cy="315" rx="101" ry="26" fill="#fce7f3" stroke="#ec4899"/>
  <text class="case" x="340" y="319">返回处理结果</text>

  <rect x="540" y="178" width="135" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="actor" x="608" y="209">外部业务系统</text>
</svg>
