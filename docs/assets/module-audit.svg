<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 408" width="780" role="img" aria-labelledby="title desc">
  <title id="title">M6 审计与统计内部职责</title>
  <desc id="desc">关键事件同步保存；查询导出接收入口已校验管理范围，不反向查询业务模块；允许鉴权仅计数。本期没有可靠暂存和补录队列。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
  <style>
    text { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; fill:#1e293b; text-anchor:middle; }
    .title { font-size:16px; font-weight:600; } .body { font-size:12px; } .note { font-size:10px; fill:#64748b; }
    .flow { fill:none; stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
  </style>
  <rect width="780" height="408" fill="#fff"/>
  <text class="title" x="390" y="32">M6 审计与统计内部职责</text>
  <path class="flow" d="M250,108 L269,108"/>
  <path class="flow" d="M505,108 L524,108"/>
  <path class="flow" d="M250,210 L269,210"/>
  <path class="flow" d="M505,210 L524,210"/>
  <path class="flow" d="M250,303 L269,303"/>
  <path class="flow" d="M505,303 L524,303"/>
  <rect x="25" y="72" width="220" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="135" y="99">认证、管理、拒绝及异常</text>
  <text class="note" x="135" y="117">事件包含归属、结果及原因</text>
  <rect x="280" y="72" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="99">同步事件保存</text>
  <text class="note" x="390" y="117">保存确认后才报告相应成功</text>
  <rect x="535" y="72" width="220" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="645" y="99">事件存储</text>
  <text class="note" x="645" y="117">本模块 JPA Repository</text>
  <rect x="25" y="174" width="220" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="135" y="198">已校验的管理范围</text>
  <text class="note" x="135" y="216">由调用入口取得并传入</text>
  <text class="note" x="135" y="234">M6 不反向查询业务模块</text>
  <rect x="280" y="174" width="220" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="198">按范围查询与导出</text>
  <text class="note" x="390" y="216">读取事件，保持部门归属</text>
  <text class="note" x="390" y="234">查询与导出行为也留痕</text>
  <rect x="535" y="174" width="220" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="645" y="198">范围内结果</text>
  <text class="note" x="645" y="216">列表、详情与导出内容</text>
  <text class="note" x="645" y="234">不含可复用凭据</text>
  <rect x="25" y="276" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="135" y="299">允许鉴权</text>
  <text class="note" x="135" y="317">本期不逐条留痕</text>
  <rect x="280" y="276" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="390" y="299">累计计数与耗时</text>
  <text class="note" x="390" y="317">与拒绝、异常分别统计</text>
  <rect x="535" y="276" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="645" y="299">运行统计</text>
  <text class="note" x="645" y="317">调用量、允许量和耗时</text>
  <text class="note" x="390" y="365">本期没有可靠暂存补录队列；存储失败按审计故障约束处理。</text>
  <text class="note" x="390" y="383">箭头：概念运行调用与状态访问。职责框不规定源码依赖或具体类。</text>
</svg>
