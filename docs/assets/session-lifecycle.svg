<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1036px" height="744px" viewBox="0 0 1036 744"><defs><style type="text/css">text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style></defs><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="25" y="25" width="960" height="44" rx="4.4" ry="4.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="20px" style="fill: rgb(30, 41, 59);"><text x="505" y="56">一个统一会话的生命周期（状态转换）</text></g></g></g><g data-cell-id="start"><g transform="translate(0.5,0.5)"><ellipse cx="495" cy="130" rx="20" ry="20" fill="#64748b" stroke="#94a3b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(148, 163, 184);"/></g></g><g data-cell-id="active"><g transform="translate(0.5,0.5)"><rect x="325" y="230" width="340" height="80" rx="8" ry="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(59, 130, 246);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="495" y="267.5">有效统一会话</text><text x="495" y="284.5">固定期限最多 8 小时</text></g></g></g><g data-cell-id="invalid"><g transform="translate(0.5,0.5)"><rect x="325" y="470" width="340" height="80" rx="8" ry="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.3" pointer-events="all" style="fill: rgb(252, 231, 243); stroke: rgb(236, 72, 153);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="495" y="507.5">失效统一会话</text><text x="495" y="524.5">后续请求拒绝</text></g></g></g><g data-cell-id="end"><g transform="translate(0.5,0.5)"><ellipse cx="495" cy="640" rx="20" ry="20" fill="#64748b" stroke="#94a3b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(148, 163, 184);"/></g></g><g data-cell-id="scope"><g transform="translate(0.5,0.5)"><rect x="60" y="375" width="230" height="70" rx="7" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" pointer-events="all" style="fill: rgb(248, 250, 252); stroke: rgb(148, 163, 184);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="175" y="407.5">当前图跟踪一个会话</text><text x="175" y="424.5">其他浏览器会话独立</text></g></g></g><g data-cell-id="new"><g transform="translate(0.5,0.5)"><rect x="715" y="470" width="230" height="80" rx="8" ry="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.3" pointer-events="all" style="fill: rgb(209, 250, 229); stroke: rgb(34, 197, 94);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="830" y="507.5">重新登录另建会话</text><text x="830" y="524.5">旧会话不恢复</text></g></g></g><g data-cell-id="e1"><g transform="translate(0.5,0.5)"><path d="M 495 150 Q 495 150 495 221.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 495 228.55 L 490.35 219.25 L 495 221.57 L 499.65 219.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e1-label"><g><rect x="290" y="165" width="170" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="375" y="185">认证成功建立</text></g></g></g><g data-cell-id="e2"><g transform="translate(0.5,0.5)"><path d="M 495 310 Q 495 310 495 461.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 495 468.55 L 490.35 459.25 L 495 461.57 L 499.65 459.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e2-label"><g><rect x="525" y="355" width="205" height="40" rx="4" ry="4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="627.5" y="373">到期／统一退出</text><text x="627.5" y="387">员工停用／进程重启</text></g></g></g><g data-cell-id="e3"><g transform="translate(0.5,0.5)"><path d="M 665 270 Q 805 270 805 227.5 Q 805 185 650 185 Q 495 185 495 221.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 495 228.55 L 490.35 219.25 L 495 221.57 L 499.65 219.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e3-label"><g><rect x="675" y="130" width="245" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="797.5" y="150">正常使用，不续期</text></g></g></g><g data-cell-id="e4"><g transform="translate(0.5,0.5)"><path d="M 495 550 Q 495 550 495 611.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 495 618.55 L 490.35 609.25 L 495 611.57 L 499.65 609.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e4-label"><g><rect x="525" y="580" width="120" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="585" y="600">结束</text></g></g></g><g data-cell-id="note"><g><rect x="60" y="665" width="890" height="28" rx="2.8" ry="2.8" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="505" y="684">员工停用影响该员工全部会话；统一退出只影响当前统一会话。</text></g></g></g></g></g></g></svg>
