dth="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 645 533.55 L 640.35 524.25 L 645 526.57 L 649.65 524.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e5"><g transform="translate(0.5,0.5)"><path d="M 827.5 401 Q 980 465 980 526.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 980 533.55 L 975.35 524.25 L 980 526.57 L 984.65 524.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e6"><g transform="translate(0.5,0.5)"><path d="M 980 685 Q 980 685 980 623.43" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" stroke-dasharray="7.8 5.2" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 980 616.45 L 984.65 625.75 L 980 623.43 L 975.35 625.75 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="e6-label"><g><rect x="990" y="630" width="125" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="1052.5" y="650">实现契约</text></g></g></g><g data-cell-id="note1"><g><rect x="60" y="805" width="1090" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="605" y="826">实线：源码使用；虚线：实现契约。运行时由 Spring 装配实现，用例经契约调用。</text></g></g></g><g data-cell-id="note2"><g><rect x="60" y="850" width="1090" height="30" rx="3" ry="3" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="605" y="870">仅在需要隔离或替换时增加端口与适配；两个结构都遵守 Controller 不直存、跨模块不读 Repository。</text></g></g></g></g></g></g></svg>
