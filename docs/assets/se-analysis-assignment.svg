<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="490" viewBox="0 0 1170 490"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:#000}</style><rect width="1170" height="490" fill="#fff"/><g transform="translate(25,25)"><path d="M305,61.5 L399,61.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M399,61.5 L389,66.5 L392,61.5 L389,56.5Z" fill="#000"/><path d="M715,61.5 L809,61.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M809,61.5 L799,66.5 L802,61.5 L799,56.5Z" fill="#000"/><path d="M305,311.5 L399,311.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M399,311.5 L389,316.5 L392,311.5 L389,306.5Z" fill="#000"/><path d="M715,311.5 L809,311.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M809,311.5 L799,316.5 L802,311.5 L799,306.5Z" fill="#000"/><path d="M970,108 C970,235,150,200,150,259" fill="none" stroke="#000" stroke-width="1.5"/><path d="M150,259 L145,249 L150,252 L155,249Z" fill="#000"/><rect x="0" y="20" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="70.95" text-anchor="middle" font-size="27">选员工、系统和角色</text><rect x="410" y="20" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="54.075" text-anchor="middle" font-size="27">展示原角色</text><text x="560" y="87.825" text-anchor="middle" font-size="27">确认替换影响</text><rect x="820" y="20" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="970" y="70.95" text-anchor="middle" font-size="27">检查整批管理范围</text><rect x="0" y="270" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="320.95" text-anchor="middle" font-size="27">合法范围内逐项处理</text><rect x="410" y="270" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="304.075" text-anchor="middle" font-size="27">成功项保留</text><text x="560" y="337.825" text-anchor="middle" font-size="27">失败项可重试</text><rect x="820" y="270" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="970" y="304.075" text-anchor="middle" font-size="27">展示逐项结果</text><text x="970" y="337.825" text-anchor="middle" font-size="27">及最迟生效期限</text><text x="530" y="169.7" text-anchor="middle" font-size="22">越范围整批拒绝；合法时继续下行</text><text x="560" y="418.05" text-anchor="middle" font-size="23">并发冲突重新确认；撤销一个系统的角色不结束身份会话，也不影响其他系统</text></g></svg>