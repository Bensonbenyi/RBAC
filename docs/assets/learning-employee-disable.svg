amily="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="845" y="103">M6 审计 / M1 会话</text></g></g></g><g data-cell-id="step0"><g transform="translate(0.5,0.5)"><rect x="30" y="152" width="190" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(245, 158, 11);"/></g><g data-cell-id="step0-line0"><g><rect x="38" y="162.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="177.4">1. EmployeeLifecycle.state</text></g></g></g><g data-cell-id="step0-line1"><g><rect x="38" y="182" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="196.6">开启跨模块事务</text></g></g></g></g><g data-cell-id="step1"><g transform="translate(0.5,0.5)"><rect x="270" y="242" width="190" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(245, 158, 11);"/></g><g data-cell-id="step1-line0"><g><rect x="278" y="252.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="365" y="267.4">2. 治理锁、范围、员工锁</text></g></g></g><g data-cell-id="step1-line1"><g><rect x="278" y="272" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-fam