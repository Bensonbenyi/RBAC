ang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="605" y="466.6">撤销全部系统分配</text></g></g></g></g><g data-cell-id="step4"><g transform="translate(0.5,0.5)"><rect x="750" y="512" width="190" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(245, 158, 11);"/></g><g data-cell-id="step4-line0"><g><rect x="758" y="522.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="845" y="537.4">5. M6 保存撤权审计</text></g></g></g><g data-cell-id="step4-line1"><g><rect x="758" y="542" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="845" y="556.6">状态与分配尚未提交</text></g></g></g></g><g data-cell-id="step5"><g transform="translate(0.5,0.5)"><rect x="30" y="602" width="190" height="60" rx="6" ry="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2" pointer-events="all" style="fill: rgb(209, 250, 229); stroke: rgb(34, 197, 94);"/></g><g data-cell-id="step5-line0"><g><rect x="38" y="612.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="627.4">6. 数据库事务提交</text></g></g></g><g data-cell-id="step5-line1"><g><rect x="38" y="632" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="646.6">失败则无提交后动作</text></g></g></g></g><g data-cell-id="step6"><g transform="translate(0.5,0.5)"><rect x="750" y="692" width="190" height="60" rx="6" ry="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2" pointer-events="all" style="fill: rgb(243, 232, 255); stroke: rgb(168, 85, 247);"/></g><g data-cell-id="step6-line0"><g><rect x="758" y="702.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="845" y="717.4">7. afterCommit 调用 M1</text></g></g></g><g data-cell-id="step6-line1"><g><rect x="758" y="722" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="845" y="736.6">结束该员工全部会话</text></g></g></g></g><g data-cell-id="step7"><g transform="translate(0.5,0.5)"><rect x="30" y="782" width="190" height="60" rx="6" ry="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2" pointer-events="all" style="fill: rgb(209, 250, 229); stroke: rgb(34, 197, 94);"/></g><g data-cell-id="step7-line0"><g><rect x="38" y="792.8" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="807.4">8. 后续请求核验停用事实</text></g></g></g><g data-cell-id="step7-line1"><g><rect x="38" y="812" width="174" height="19.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="125" y="826.6">技术故障仍拒绝受控操作</text></g></g></g></g><g data-cell-id="footer"><g><rect x="30" y="883" width="910" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="11px" style="fill: rgb(71, 85, 105);"><text x="485" y="896.5">箭头：调用 / 提交后触发；虚线：后续可观察结果。金色在同一数据库事务，紫色不在事务内。</text></g></g></g></g></g></g></svg>