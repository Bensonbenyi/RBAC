82.5 724 632.5 724 Q 782.5 724 782.5 736.57" fill="none" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(100, 116, 139);"/><path d="M 782.5 743.55 L 777.85 734.25 L 782.5 736.57 L 787.15 734.25 Z" fill="#64748b" stroke="#64748b" stroke-width="1.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(100, 116, 139); stroke: rgb(100, 116, 139);"/></g></g><g data-cell-id="note"><g><rect x="45" y="855" width="900" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="12px" style="fill: rgb(30, 41, 59);"><text x="495" y="876">平台超时或不可用时拒绝操作；已开始执行的业务不由平台回滚。</text></g></g></g></g></g></g></svg>
