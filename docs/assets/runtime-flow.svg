 Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="482.5" y="117">统一平台</text></g></g></g><g data-cell-id="lane2"><g transform="translate(0.5,0.5)"><rect x="645" y="90" width="275" height="750" rx="22" ry="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="7.8 5.2" pointer-events="all" style="fill: rgb(248, 250, 252); stroke: rgb(148, 163, 184);"/></g></g><g data-cell-id="lane2-title"><g><rect x="657" y="98" width="251" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="782.5" y="117">外部业务执行</text></g></g></g><g data-cell-id="s0"><g transform="translate(0.5,0.5)"><rect x="60" y="145" width="245" height="78" rx="21.84" ry="21.84" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(59, 130, 246);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="182.5" y="190">后端发起操作鉴权</text></g></g></g><g data-cell-id="s1"><g transform="translate(0.5,0.5)"><rect x="360" y="265" width="245" height="78" rx="21.84" ry="21.84" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(245, 158, 11);"/></g><g><g fill="#1e293b" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif" text-anchor="middle" font-size="14px" style="fill: rgb(30, 41, 59);"><text x="482.5" y="301.5">核验系统、员工与会话</text><text x="482.5" y="318.5">计算当前有效权限</text></g></g></g><g data-cell-id="e1"><g transform="translate(0.5,0.5)"><path d="M 182.5 223 Q 182.5 244 332.5 244 Q 482.5 244 482.5 256.57" fill="none" stroke="#64748b" stroke-width="1.