<svg viewBox="0 0 700 570" width="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; letter-spacing: 0; }
    .title { font-size: 16px; font-weight: 600; }
    .step { font-size: 11px; text-anchor: middle; }
    .note { font-size: 9px; fill: #64748b; text-anchor: middle; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.1; marker-end: url(#arrow); }
  </style>
  <rect width="700" height="570" fill="#ffffff"/>
  <text class="title" x="350" y="30" text-anchor="middle">权限目录变更和失败重试流程</text>

  <path class="flow" d="M350,111 L350,123"/>
  <path class="flow" d="M350,195 L350,207"/>
  <path class="flow" d="M350,279 L350,291"/>
  <path class="flow" d="M350,363 L350,375"/>
  <path class="flow" d="M350,447 L350,459"/>
  <path class="flow" d="M466,414 C500,414 500,331 529,331"/>
  <path d="M535,359 C500,390 500,498 472,498" fill="none" stroke="#ef4444" stroke-width="1.1" marker-end="url(#arrow-red)"/>
  <path d="M535,331 C500,286 500,246 472,246" fill="none" stroke="#ef4444" stroke-width="1.1" marker-end="url(#arrow-red)"/>

  <rect x="239" y="50" width="222" height="56" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="350" y="74">外部系统上报权限目录</text>
  <text class="note" x="350" y="92">新增、修改或停用权限项</text>

  <rect x="239" y="134" width="222" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="350" y="158">校验系统和权限项</text>
  <text class="note" x="350" y="176">重复上报不重复创建</text>

  <rect x="239" y="218" width="222" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="350" y="242">更新有效权限目录</text>
  <text class="note" x="350" y="260">停用项立即失效</text>

  <rect x="239" y="302" width="222" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="step" x="350" y="326">计算受影响角色和员工</text>
  <text class="note" x="350" y="344">建立权限更新或撤权任务</text>

  <rect x="239" y="386" width="222" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="step" x="350" y="410">向外部系统同步当前目标状态</text>
  <text class="note" x="350" y="428">发送结果应可重复处理</text>

  <rect x="239" y="470" width="222" height="56" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="step" x="350" y="494">更新生效状态并记录审计</text>
  <text class="note" x="350" y="512">成功任务结束</text>

  <rect x="540" y="303" width="135" height="56" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text class="step" x="607" y="327">同步失败</text>
  <text class="note" x="607" y="345">保留失败原因</text>

  <text class="note" x="522" y="285">失败</text>
  <text class="note" x="504" y="455">自动或人工重试</text>
</svg>
