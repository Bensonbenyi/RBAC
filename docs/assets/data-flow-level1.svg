<svg viewBox="0 0 800 600" width="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; letter-spacing: 0; }
    .title { font-size: 16px; font-weight: 600; }
    .name { font-size: 11px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 9px; fill: #64748b; text-anchor: middle; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.1; }
  </style>
  <rect width="800" height="600" fill="#ffffff"/>
  <text class="title" x="400" y="30" text-anchor="middle">统一权限管理系统一级数据流</text>

  <!-- External entities -->
  <rect x="25" y="62" width="170" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="name" x="110" y="89">最高管理员</text>
  <rect x="315" y="62" width="170" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="name" x="400" y="89">部门管理员</text>
  <rect x="605" y="62" width="170" height="46" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text class="name" x="690" y="89">外部业务系统</text>

  <!-- Platform boundary -->
  <rect x="20" y="133" width="760" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text class="note" x="40" y="151" text-anchor="start">统一权限管理系统</text>

  <!-- Connectors before boxes -->
  <path class="flow" d="M110,113 C110,130 110,140 110,151" marker-end="url(#arrow-blue)" stroke="#3b82f6"/>
  <path class="flow" d="M400,113 C400,137 110,136 110,151" marker-end="url(#arrow-blue)" stroke="#3b82f6"/>
  <path class="flow" d="M690,113 C690,140 677,140 677,151" marker-end="url(#arrow-green)" stroke="#22c55e"/>
  <path class="flow" d="M190,192 L213,192" marker-end="url(#arrow)"/>
  <path class="flow" d="M379,192 L402,192" marker-end="url(#arrow)"/>
  <path class="flow" d="M568,192 L591,192" marker-end="url(#arrow)"/>
  <path class="flow" d="M677,227 C677,250 525,247 525,264" marker-end="url(#arrow)"/>
  <path class="flow" d="M299,227 C299,252 395,248 395,264" marker-end="url(#arrow)"/>
  <path class="flow" d="M299,227 C299,320 115,360 115,409" marker-end="url(#arrow)"/>
  <path class="flow" d="M488,227 C488,320 305,360 305,409" marker-end="url(#arrow)"/>
  <path class="flow" d="M677,227 C677,320 495,360 495,409" marker-end="url(#arrow)"/>
  <path class="flow" d="M550,305 C610,305 640,360 685,409" marker-end="url(#arrow)"/>
  <path class="flow" d="M195,456 C250,456 250,313 309,306" marker-end="url(#arrow)"/>
  <path class="flow" d="M305,415 C305,380 395,370 395,346" marker-end="url(#arrow)"/>
  <path class="flow" d="M495,415 C495,380 470,370 470,346" marker-end="url(#arrow)"/>

  <!-- Processes -->
  <rect x="35" y="162" width="150" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="name" x="110" y="188">P1 身份与范围校验</text>
  <text class="note" x="110" y="207">登录身份、部门边界</text>

  <rect x="224" y="162" width="150" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="name" x="299" y="188">P2 基础数据管理</text>
  <text class="note" x="299" y="207">组织、员工、系统、管理员</text>

  <rect x="413" y="162" width="150" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="name" x="488" y="188">P3 权限与角色管理</text>
  <text class="note" x="488" y="207">目录、角色、角色权限</text>

  <rect x="602" y="162" width="150" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="name" x="677" y="188">P4 授权与同步</text>
  <text class="note" x="677" y="207">开户、换角、撤权、重试</text>

  <rect x="320" y="275" width="225" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="name" x="432" y="301">P5 查询与审计</text>
  <text class="note" x="432" y="320">有效权限、同步状态、日志导出</text>

  <!-- Data stores -->
  <path d="M40,420 H190 V492 H40" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="name" x="115" y="447">D1 组织与员工</text>
  <text class="note" x="115" y="468">公司、部门、员工、管理员</text>

  <path d="M230,420 H380 V492 H230" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text class="name" x="305" y="447">D2 系统与角色</text>
  <text class="note" x="305" y="468">外部系统、权限目录、角色</text>

  <path d="M420,420 H570 V492 H420" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text class="name" x="495" y="447">D3 授权与同步</text>
  <text class="note" x="495" y="468">角色分配、目标状态、任务</text>

  <path d="M610,420 H760 V492 H610" fill="#ffffff" stroke="#a855f7" stroke-width="1.2"/>
  <text class="name" x="685" y="447">D4 审计记录</text>
  <text class="note" x="685" y="468">登录、操作、同步尝试</text>

  <text class="note" x="400" y="538">数据存放区表示业务信息集合，不表示数据库、表或文件。</text>
</svg>
