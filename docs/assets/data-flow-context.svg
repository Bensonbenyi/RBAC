<svg viewBox="0 0 760 420" width="760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; letter-spacing: 0; }
    .title { font-size: 16px; font-weight: 600; }
    .name { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .flow { fill: none; stroke-width: 1.2; }
  </style>
  <rect width="760" height="420" fill="#ffffff"/>
  <text class="title" x="380" y="32" text-anchor="middle">统一权限管理系统上下文数据流</text>

  <rect x="250" y="72" width="260" height="290" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text class="note" x="270" y="91" text-anchor="start">系统边界</text>
  <rect x="285" y="147" width="190" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text class="name" x="380" y="206">统一权限管理系统</text>
  <text class="note" x="380" y="229">组织、员工、角色、授权</text>
  <text class="note" x="380" y="247">同步状态与审计</text>

  <rect x="25" y="96" width="170" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="name" x="110" y="128">最高管理员</text>
  <rect x="25" y="270" width="170" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="name" x="110" y="302">部门管理员</text>
  <rect x="565" y="183" width="170" height="68" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/>
  <text class="name" x="650" y="213">外部业务系统</text>
  <text class="note" x="650" y="233">当前 17 个，可扩展</text>

  <path class="flow" d="M200,112 C230,112 245,160 274,170" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <text class="note" x="238" y="115">全局管理操作</text>
  <path class="flow" d="M280,205 C245,210 235,139 206,139" stroke="#64748b" marker-end="url(#arrow)"/>
  <text class="note" x="230" y="191">全局查询结果</text>

  <path class="flow" d="M200,286 C230,286 245,264 274,256" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <text class="note" x="235" y="307">本部门管理操作</text>
  <path class="flow" d="M280,276 C245,294 235,313 206,313" stroke="#64748b" marker-end="url(#arrow)"/>
  <text class="note" x="235" y="333">本部门查询结果</text>

  <path class="flow" d="M480,184 C520,170 535,199 554,204" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <text class="note" x="519" y="162">开户、资料和授权变更</text>
  <path class="flow" d="M560,236 C535,243 515,266 486,254" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text class="note" x="520" y="283">权限目录与处理结果</text>

  <text class="note" x="380" y="397">普通员工是被授权对象，不直接与平台交换操作数据。</text>
</svg>
