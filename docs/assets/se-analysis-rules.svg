<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="490" viewBox="0 0 1170 490"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:#000}</style><rect width="1170" height="490" fill="#fff"/><g transform="translate(25,25)"><path d="M305,101.5 L399,101.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M399,101.5 L389,106.5 L392,101.5 L389,96.5Z" fill="#000"/><path d="M715,101.5 L809,101.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M809,101.5 L799,106.5 L802,101.5 L799,96.5Z" fill="#000"/><path d="M305,311.5 L399,311.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M399,311.5 L389,316.5 L392,311.5 L389,306.5Z" fill="#000"/><path d="M715,311.5 L809,311.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M809,311.5 L799,316.5 L802,311.5 L799,306.5Z" fill="#000"/><rect x="0" y="60" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="110.95" text-anchor="middle" font-size="27">员工</text><rect x="410" y="60" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="94.075" text-anchor="middle" font-size="27">部门角色</text><text x="560" y="127.825" text-anchor="middle" font-size="27">归属一个部门和系统</text><rect x="820" y="60" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="970" y="94.075" text-anchor="middle" font-size="27">系统权限</text><text x="970" y="127.825" text-anchor="middle" font-size="27">功能点＋操作动作</text><text x="355" y="64.85" text-anchor="middle" font-size="21">按系统分配</text><text x="765" y="64.85" text-anchor="middle" font-size="21">包含有效权限</text><rect x="0" y="270" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="320.95" text-anchor="middle" font-size="27">全局模板</text><rect x="410" y="270" width="300" height="83" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="320.95" text-anchor="middle" font-size="27">复制后