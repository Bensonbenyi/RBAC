events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  ssl_certificate /etc/letsencrypt/live/upms-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/upms-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://113.44.144.119$request_uri; }
  }
  server {
    listen 443 ssl;
    location /reports/ { alias /srv/upms/reports/; autoindex off; }
    location /design/ { alias /srv/upms/design/; autoindex off; }
    location / { proxy_pass http://127.0.0.1:18080; }
  }
  server {
    listen 8443 ssl;
    location / { proxy_pass http://172.31.12.231:18081; }
  }
  server {
    listen 9443 ssl;
    location / { proxy_pass http://172.31.12.231:18082; }
  }
}
